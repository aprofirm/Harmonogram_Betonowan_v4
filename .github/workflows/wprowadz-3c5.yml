name: Jednorazowe wdrożenie 3C.5

on:
  push:
    branches:
      - work/3c5-testy-integracyjne
    paths:
      - ".github/workflows/wprowadz-3c5.yml"

permissions:
  contents: write

jobs:
  wdrozenie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadź zmiany 3C.5
        run: python .github/wprowadz_3c5.py

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz zaliczone 3C.5
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            ETAPY_ROZWOJU.md \
            README.md \
            index.html \
            js/konfiguracja/konfiguracja.js \
            testy/TESTY_ETAP_3C.md \
            testy/etap_3c_4.test.js \
            testy/etap_3c_5.test.js
          git commit -m "Domknij testy integracyjne 3C.5"
          git push
