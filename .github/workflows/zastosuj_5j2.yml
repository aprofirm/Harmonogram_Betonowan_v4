name: Zastosuj 5J.2

on:
  push:
    branches: [work/5j2-publikacja]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zastosuj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/5j2-publikacja

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadź 5J.2
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/zastosuj_5j2.py
          python3 - <<'PY'
          from pathlib import Path
          plik = Path("testy/etap_5j_1.test.js")
          tresc = plik.read_text(encoding="utf-8")
          stara = 'assert.match(konfiguracja, /punktEtapu:\\s*"5J\\.1"/);'
          nowa = 'assert.match(konfiguracja, /punktEtapu:\\s*"5J\\.[1-3]"/);'
          if stara not in tresc:
              raise RuntimeError("Nie znaleziono historycznej asercji punktEtapu w 5J.1")
          plik.write_text(tresc.replace(stara, nowa), encoding="utf-8")
          PY
          rm .github/zastosuj_5j2.py
          rm .github/workflows/zastosuj_5j2.yml

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          liczba=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba=$((liczba + 1))
          done
          echo "Pełna regresja: $liczba zestawów — wszystkie poprawne."
          test "$liczba" -eq 93

      - name: Zapisz 5J.2 na gałęzi roboczej
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "5J.2: potwierdź publikację Etapu 5"
          git push origin HEAD:work/5j2-publikacja
