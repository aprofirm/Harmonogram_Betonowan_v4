name: Kontrolowane wdrozenie 6B.3

on:
  push:
    branches:
      - work/6b3-statusy-adresu

permissions:
  contents: write

jobs:
  wdrozenie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadz zmiany 6B.3
        run: python3 .github/patch_6b3.py

      - name: Sprawdz skladnie zmienionego modelu
        run: node --check js/lokalizacje/model_lokalizacji_i_trasy.js

      - name: Sprawdz liczbe zestawow testow
        shell: bash
        run: |
          set -euo pipefail
          LICZBA=$(find testy -maxdepth 1 -name '*.test.js' | wc -l | tr -d ' ')
          echo "Zestawy testów: $LICZBA"
          test "$LICZBA" -eq 101

      - name: Uruchom pelna regresje
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz sprawdzony pakiet 6B.3
        shell: bash
        run: |
          set -euo pipefail
          rm .github/patch_6b3.py .github/workflows/wdrozenie_6b3.yml
          git config user.name "PawelP"
          git config user.email "53014565+aprofirm@users.noreply.github.com"
          git add -A
          git commit -m "6B.3: dodaj statusy jakosci adresu"
          git push origin HEAD:work/6b3-statusy-adresu
