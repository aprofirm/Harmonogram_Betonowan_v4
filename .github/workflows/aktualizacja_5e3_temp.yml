name: Tymczasowa aktualizacja 5E.3

on:
  push:
    branches:
      - etap-5e3-limit-iteracji

permissions:
  contents: write

jobs:
  aktualizuj:
    if: ${{ !contains(github.event.head_commit.message, '[skip-5e3-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: etap-5e3-limit-iteracji
          fetch-depth: 0

      - name: Wprowadz zmiany 5E.3
        run: python narzedzia/aktualizuj_5e3_temp.py

      - name: Sprawdz testy 5E
        shell: bash
        run: |
          node testy/etap_5e_1.test.js
          node testy/etap_5e_2.test.js
          node testy/etap_5e_3.test.js

      - name: Uruchom pelna regresje
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz zmiany
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/harmonogram/harmonogram.js js/konfiguracja/konfiguracja.js index.html testy/etap_5e_2.test.js testy/TESTY_ETAP_5.md README.md ETAPY_ROZWOJU.md PROJECT_DECISIONS.md
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          git commit -m "5E.3: dodaj limit stabilizacji i konflikt [skip-5e3-patch]"
          git push origin HEAD:etap-5e3-limit-iteracji
