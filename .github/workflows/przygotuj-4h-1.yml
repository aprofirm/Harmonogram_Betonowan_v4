name: Prepare 4H1 Retry

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update branch
        run: |
          set -euo pipefail
          git fetch origin 4h-1-dwa-tryby-pomp
          git checkout -B 4h-1-dwa-tryby-pomp origin/4h-1-dwa-tryby-pomp
          python narzedzia/aktualizuj_4h_1.py
          rm -f narzedzia/aktualizuj_4h_1.py
          rm -f .github/workflows/aktualizuj-4h-1.yml
          for plik in testy/*.test.js; do
            node "$plik"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "4H.1: zamknij dwa tryby pracy pomp"
          git push origin HEAD:4h-1-dwa-tryby-pomp

      - name: Clean main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm .github/workflows/przygotuj-4h-1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: usun jednorazowy workflow 4H.1"
          git push origin HEAD:main
