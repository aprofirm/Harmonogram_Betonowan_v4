name: Jednorazowa aktualizacja dokumentacji 4E

on:
  push:
    paths:
      - ".github/workflows/jednorazowa_aktualizacja_4e.yml"

permissions:
  contents: write

jobs:
  aktualizacja:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ujednolić dokumentację po 4E.4
        shell: python
        run: |
          from pathlib import Path
          import re

          etapy_path = Path("ETAPY_ROZWOJU.md")
          etapy = etapy_path.read_text(encoding="utf-8")

          stare_status = """- [ ] Etap 4 — Pompy — **rozpoczęty; całe punkty 4A–4D i podetap 4E.1
            zakończone, następny podetap to 4E.2**"""
          nowy_status = """- [ ] Etap 4 — Pompy — **rozpoczęty; całe punkty 4A–4E
            zakończone, następny podetap to 4F.1**"""
          if stare_status not in etapy:
              raise SystemExit("Nie znaleziono starego statusu Etapu 4.")
          etapy = etapy.replace(stare_status, nowy_status, 1)

          for stare, nowe in [
              ("- [ ] **4E — przejazdy pomp.**", "- [x] **4E — przejazdy pomp.**"),
              ("  - [ ] **4E.2 — budowa do budowy:**", "  - [x] **4E.2 — budowa do budowy:**"),
              ("  - [ ] **4E.3 — niezależność od map:**", "  - [x] **4E.3 — niezależność od map:**"),
              ("  - [ ] **4E.4 — testy:**", "  - [x] **4E.4 — testy:**"),
              ("- [ ] czas przejazdu pompy wpływa na możliwość rozpoczęcia następnej budowy,", "- [x] czas przejazdu pompy wpływa na możliwość rozpoczęcia następnej budowy,"),
              ("- [ ] program odróżnia przejazd z bazy od przejazdu między budowami,", "- [x] program odróżnia przejazd z bazy od przejazdu między budowami,"),
          ]:
              if stare not in etapy:
                  raise SystemExit(f"Nie znaleziono wpisu do aktualizacji: {stare}")
              etapy = etapy.replace(stare, nowe, 1)

          stare_nastepny = """Rozpocząć **4E.2 — budowa do budowy**: dodać osobny czas przejazdu pompy
          pomiędzy każdą parą kolejnych miejsc pracy, ponieważ nie można go wyprowadzić
          z trasy betoniarnia → budowa."""
          nowy_nastepny = """Rozpocząć **4F.1 — stabilna kolejność**: budowy wymagające pompy rozpatrywać
          deterministycznie według planowanego startu i kolejności wejściowej. Ten krok
          przygotowuje kolejność do właściwego wyboru pierwszej pasującej pompy w 4F.2."""
          if stare_nastepny not in etapy:
              raise SystemExit("Nie znaleziono starego wpisu Kolejny krok.")
          etapy = etapy.replace(stare_nastepny, nowy_nastepny, 1)

          sekcja_4e = """

          ## Zamknięcie 4E.2–4E.4 i całego 4E — 2026-08-26

          - [x] **4E.2:** przejazd `budowa A → budowa B` ma własny, kierunkowy czas
            i rozpoczyna się dopiero po pełnym zakończeniu zajętości pompy na A;
          - [x] **4E.3:** silnik otrzymuje gotowe minuty oraz informacyjne źródło
            wartości i działa identycznie dla wpisu ręcznego, pamięci tras, mapy i
            przyszłego routingu ciężarowego, bez zależności od internetu;
          - [x] **4E.4:** brak trasy daje jawny błąd z parą budów, `0 min` jest
            poprawną wartością, `A → B` i `B → A` mogą się różnić, a przejazd
            uniemożliwiający przygotowanie na czas wylicza najwcześniejszy start,
            wielkość opóźnienia i przyczynę `przejazd-miedzy-budowami`;
          - [x] moduł `js/pompy/przejazdy_pomp.js` jest ładowany przez `index.html`
            po module pomp, więc ten sam mechanizm jest dostępny również w wersji
            przeglądarkowej, a nie tylko w testach Node.js;
          - [x] 4E nie zmienia `StartPlanowany`, `StartZadany` ani `StartRoboczy` i
            nie przydziela jeszcze konkretnej pompy; wykorzystanie wyliczonej
            dostępności należy do 4F, a wspólna korekta pomp i gruszek do Etapu 5;
          - [x] pełna regresja po implementacji 4E.4 zakończyła się powodzeniem —
            wszystkie **36/36** plików `testy/*.test.js` przeszły poprawnie.

          Cały punkt **4E — przejazdy pomp** jest zakończony. Nie jest wymagany
          osobny test operatora, ponieważ 4E.2–4E.4 nie dodają nowego pola ani nowej
          operacji w interfejsie; dołączenie modułu do strony jest objęte testem
          automatycznym. Następny podetap to **4F.1 — stabilna kolejność**.
          """
          sekcja_4e = re.sub(r"^          ", "", sekcja_4e, flags=re.M)
          if "## Zamknięcie 4E.2–4E.4 i całego 4E — 2026-08-26" not in etapy:
              etapy = etapy.rstrip() + sekcja_4e + "\n"
          etapy_path.write_text(etapy, encoding="utf-8")

          decyzje_path = Path("PROJECT_DECISIONS.md")
          decyzje = decyzje_path.read_text(encoding="utf-8")
          decyzja_90 = """
          ## 90. Przejazd między budowami jest kierunkowy i ogranicza gotowość pompy

          Po zakończeniu pierwszej pracy kolejny przejazd pompy `budowa A → budowa B`
          jest rzeczywistą częścią dostępności zasobu. Pompa może wyjechać dopiero po
          zakończeniu pełnego cyklu na A, a po przyjeździe na B musi mieć jeszcze czas
          wymagany na przygotowanie przed rozpoczęciem betonowania.

          Czasu `A → B` nie wolno wyprowadzać wyłącznie z dwóch odległości
          `betoniarnia → A` i `betoniarnia → B`. Same te wartości nie określają
          wzajemnego położenia budów ani rzeczywistej trasy drogowej. Nie wolno też
          po cichu zastępować przejazdu trasą przez betoniarnię ani odległością w
          linii prostej.

          Trasy są kierunkowe: `A → B` i `B → A` są osobnymi wartościami i mogą mieć
          różne czasy. `0 min` jest prawidłową wartością, natomiast brak czasu trasy
          ma być jawnie zgłoszony zamiast przyjęcia zera lub wartości zastępczej.

          Silnik pomp otrzymuje gotowe `czasPrzejazduMinuty` i informacyjne
          `zrodloCzasuPrzejazdu`. Źródłem może być wpis ręczny, lokalna pamięć tras,
          zwykła usługa mapowa albo przyszły routing dla ciężkich pojazdów. Źródło
          nie zmienia logiki obliczeń, dzięki czemu silnik działa offline, gdy czas
          jest już znany, a automatyczne pozyskiwanie tras pozostaje zakresem Etapu 6.

          Jeżeli przejazd powoduje spóźniony przyjazd na B, wynik zachowuje
          najwcześniejszy możliwy start betonowania, liczbę minut opóźnienia i
          przyczynę `przejazd-miedzy-budowami`. Etap 4E sam nie nadpisuje
          `StartPlanowany`, `StartZadany` ani `StartRoboczy`. Dane wykorzysta
          przydział pomp w 4F, prezentacja notki należy do 4I.4, a wspólne faktyczne
          przesunięcie planu pomp i gruszek pozostaje zakresem Etapu 5.

          ---

          """
          decyzja_90 = re.sub(r"^          ", "", decyzja_90, flags=re.M)
          marker = "# Powiązane tematy otwarte"
          if marker not in decyzje:
              raise SystemExit("Nie znaleziono miejsca na decyzję 90.")
          if "## 90. Przejazd między budowami" not in decyzje:
              decyzje = decyzje.replace(marker, decyzja_90 + marker, 1)
          decyzje_path.write_text(decyzje, encoding="utf-8")

          backlog_path = Path("POMYSLY_I_BACKLOG.md")
          backlog = backlog_path.read_text(encoding="utf-8")
          nowy_p011 = """## P-011 — Ręczne czasy przejazdów pomp przed integracją mapową

          **Data:** 2026-08-23; doprecyzowano 2026-08-26  
          **Status:** CZĘŚCIOWO ROZSTRZYGNIĘTY  
          **Powiązanie:** Etap 4E, 4F, 4I i Etap 6 — Pompy oraz trasy

          Część silnikowa została rozstrzygnięta w decyzjach 89–90 i podetapach
          4E.1–4E.4. Pierwszy przejazd `betoniarnia → budowa` pozostaje wyłącznie
          informacyjny. Każdy kolejny przejazd `budowa A → budowa B` ma osobny,
          kierunkowy czas, realnie wpływa na gotowość pompy i może wyznaczyć
          późniejszy możliwy start następnego betonowania.

          Silnik przyjmuje gotowy `czasPrzejazduMinuty` niezależnie od źródła. Brak
          wartości jest jawnym problemem, `0 min` jest dozwolone, a `A → B` i
          `B → A` nie muszą być równe. Automatyczne pozyskiwanie czasu z map nadal
          pozostaje zakresem Etapu 6 i nie może być wymagane do działania offline.

          Otwarte pozostaje rozwiązanie operatorskie: gdzie i w jaki sposób przed
          pełną integracją mapową wpisać, wybrać lub potwierdzić czas dla konkretnej
          pary budów oraz jak zapisać taką parę w lokalnej pamięci tras. Klucz
          pamięci powinien docelowo opierać się na jednoznacznej lokalizacji
          (znormalizowany adres i/lub współrzędne), a nie wyłącznie na swobodnej
          nazwie budowy. Rozwiązanie interfejsu nie może zmienić kontraktu silnika
          zbudowanego w 4E.
          """
          nowy_p011 = re.sub(r"^          ", "", nowy_p011, flags=re.M)
          wzorzec = re.compile(
              r"## P-011 — Ręczne czasy przejazdów pomp przed integracją mapową.*?(?=\n---\n\n## P-012)",
              re.S,
          )
          if not wzorzec.search(backlog):
              raise SystemExit("Nie znaleziono sekcji P-011.")
          backlog = wzorzec.sub(nowy_p011.rstrip(), backlog, count=1)
          backlog_path.write_text(backlog, encoding="utf-8")

          test_doc = Path("testy/TESTY_ETAP_4E_4.md")
          test_doc.write_text("""# TESTY — ETAP 4E.4

          ## Zakres

          Podetap **4E.4 — przypadki brzegowe i zamknięcie przejazdów pomp**
          sprawdza zachowanie kontraktu `budowa A → budowa B` przed rozpoczęciem
          właściwego przydziału pomp w 4F.

          Test `testy/etap_4e_4.test.js` potwierdza:

          1. brak czasu trasy daje jawny komunikat zawierający parę budów;
          2. ujemny lub nieliczbowy czas jest odrzucany;
          3. `0 min` jest poprawnym czasem przejazdu;
          4. `A → B` i `B → A` mogą mieć różne wartości;
          5. przejazd rozpoczyna się dopiero po pełnym zakończeniu zajętości na A;
          6. spóźniony przyjazd na B wylicza najwcześniejszy start betonowania,
             opóźnienie i przyczynę `przejazd-miedzy-budowami`;
          7. obliczenie nie przesuwa jeszcze godzin budowy;
          8. `js/pompy/przejazdy_pomp.js` jest wczytywany przez `index.html` po
             `pompy.js`, więc mechanizm działa również w aplikacji przeglądarkowej.

          ## Wynik regresji — 2026-08-26

          GitHub Actions po ostatecznych poprawkach zakończył pełną regresję
          powodzeniem. Wszystkie **36/36** plików `testy/*.test.js` przeszły.

          Cały punkt **4E — przejazdy pomp** jest zakończony. Następny krok:
          **4F.1 — stabilna kolejność budów wymagających pompy**.
          """.replace("          ", ""), encoding="utf-8")

          workflow = Path(".github/workflows/jednorazowa_aktualizacja_4e.yml")
          if workflow.exists():
              workflow.unlink()

      - name: Zapisz zmiany
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PawelP"
          git config user.email "53014565+aprofirm@users.noreply.github.com"
          git add -A
          git commit -m "Domknij dokumentację etapu 4E"
          git push origin main
