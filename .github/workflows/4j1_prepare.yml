name: Przygotowanie 4J.1

on:
  push:
    branches: [work/4j-1-pelna-regresja]

permissions:
  contents: write

jobs:
  przygotowanie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: work/4j-1-pelna-regresja

      - name: Wprowadź 4J.1
        shell: bash
        run: |
          set -euo pipefail
          python .github/4j1_patch.py

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz gotowy pakiet 4J.1
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/4j1_patch.py .github/workflows/4j1_prepare.yml
          git config user.name "PawelP"
          git config user.email "53014565+aprofirm@users.noreply.github.com"
          git add -A
          git commit -m "4J.1: pełna regresja automatyczna"
          git push origin HEAD:work/4j-1-pelna-regresja
