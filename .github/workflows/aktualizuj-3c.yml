name: Jednorazowa aktualizacja 3C.1-3C.2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aktualizuj-3c.yml"

permissions:
  contents: write

jobs:
  aktualizacja:
    if: github.event.head_commit.message == 'Uruchom aktualizację 3C.1-3C.2'
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Uruchom pełną regresję przed zmianą statusu
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zaktualizuj pamięć projektu
        run: python .github/aktualizuj_3c.py

      - name: Zapisz postęp 3C.1-3C.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETAPY_ROZWOJU.md PROJECT_DECISIONS.md README.md testy/TESTY_ETAP_3.md js/konfiguracja/konfiguracja.js
          if git diff --cached --quiet; then
            echo "Brak zmian dokumentacji do zapisania."
            exit 1
          fi
          git commit -m "Zapisz postęp 3C.1-3C.2"
          git push
