name: Tymczasowa aktualizacja 5E.1

on:
  push:
    branches:
      - etap-5e1-deterministyczna-iteracja

permissions:
  contents: write

jobs:
  aktualizuj:
    if: ${{ !contains(github.event.head_commit.message, '[skip-5e1-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: etap-5e1-deterministyczna-iteracja
          fetch-depth: 0

      - name: Wprowadz zmiany 5E.1
        run: python narzedzia/aktualizuj_5e1_temp.py

      - name: Zapisz zmiany
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/harmonogram/harmonogram.js js/konfiguracja/konfiguracja.js index.html testy/etap_5e_1.test.js testy/TESTY_ETAP_5.md ETAPY_ROZWOJU.md README.md PROJECT_DECISIONS.md
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          git commit -m "5E.1: dodaj deterministyczna iteracje [skip-5e1-patch]"
          git push origin HEAD:etap-5e1-deterministyczna-iteracja
