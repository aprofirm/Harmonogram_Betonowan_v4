name: Wdrozenie 4G.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wdrozenie_4g_1.yml"

permissions:
  contents: write

jobs:
  wdrozenie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dodaj silnik i test 4G.1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path

          Path("js/pompy/minimalna_liczba_pomp.js").write_bytes(
              base64.b64decode(" ")
          )
          Path("testy/etap_4g_1.test.js").write_bytes(
              base64.b64decode(" b250ZWtzdCk7CgogIFsKICAgICJqcy9wb21weS9wb21weS5qcyIsCiAgICAianMvcG9tcHkvbWluaW1hbG5hX2xpY3piYV9wb21wLmpzIgogIF0uZm9yRWFjaChmdW5jdGlvbiAoc2NpZXprYSkgewogICAgbmV3IHZtLlNjcmlwdCh3Y3p5dGFqKHNjaWV6a2EpLCB7IGZpbGVuYW1lOiBzY2llemthIH0pLnJ1bkluQ29udGV4dChr <SECRET>aUF<SECRET>UsIGRhbmUgfHwge30pOwp9CgpmdW5jdGlvbiB1dHdvcnpLdXJzKGlkQnVkb3d5LCBtaW51dGFTdGFydHUsIG1pbnV0YUtvbmNhKSB7CiAgcmV0dXJuIHsKICAgIGlkS3Vyc3U6ICJLVVJTL  ")
          )

          sciezka_index = Path("index.html")
          index = sciezka_index.read_text(encoding="utf-8")
          stary_skrypt = '    <script defer src="js/pompy/przydzial_pomp.js"></script>\n'
          nowy_skrypt = (
              stary_skrypt +
              '    <script defer src="js/pompy/minimalna_liczba_pomp.js"></script>\n'
          )
          if stary_skrypt not in index:
              raise SystemExit("Nie znaleziono miejsca ładowania modułu przydziału pomp.")
          index = index.replace(stary_skrypt, nowy_skrypt, 1)
          stara_stopka = "        <span>4G.1 · minimalna liczba pomp</span>"
          nowa_stopka = "        <span>4G.2 · widok minimalnej liczby pomp</span>"
          if stara_stopka not in index:
              raise SystemExit("Nie znaleziono oczekiwanej stopki 4G.1.")
          index = index.replace(stara_stopka, nowa_stopka, 1)
          sciezka_index.write_text(index, encoding="utf-8")
          PY

      - name: Test 4G.1 i pełna regresja
        shell: bash
        run: |
          set -euo pipefail
          node testy/etap_4g_1.test.js
          liczba_testow=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba_testow=$((liczba_testow + 1))
          done
          echo "Liczba plików testowych: $liczba_testow"
          test "$liczba_testow" -eq 43

      - name: Kontrola składni JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r plik; do
            node --check "$plik"
          done < <(git ls-files '*.js'; printf '%s\n' js/pompy/minimalna_liczba_pomp.js testy/etap_4g_1.test.js)

      - name: Zaktualizuj dokumentację 4G.1
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def zamien_raz(tekst, stary, nowy, opis):
              if stary not in tekst:
                  raise SystemExit("Nie znaleziono fragmentu: " + opis)
              return tekst.replace(stary, nowy, 1)

          etapy_sciezka = Path("ETAPY_ROZWOJU.md")
          etapy = etapy_sciezka.read_text(encoding="utf-8")
          etapy = zamien_raz(
              etapy,
              "- [ ] **4G.1 — wynik silnika:** obliczenie najmniejszej technicznej liczby\n",
              "- [x] **4G.1 — wynik silnika:** obliczenie najmniejszej technicznej liczby\n",
              "checkbox 4G.1"
          )
          etapy = zamien_raz(
              etapy,
              "- [ ] jedna pompa nie może obsługiwać dwóch budów jednocześnie,",
              "- [x] jedna pompa nie może obsługiwać dwóch budów jednocześnie,",
              "kryterium braku nakładania pomp"
          )
          etapy = zamien_raz(
              etapy,
              "- [ ] program potrafi wskazać minimalną potrzebną liczbę pomp,",
              "- [x] program potrafi wskazać minimalną potrzebną liczbę pomp,",
              "kryterium minimalnej liczby pomp"
          )
          etapy = zamien_raz(
              etapy,
              "Rozpocząć **4G.1 — wynik silnika**: obliczyć najmniejszą techniczną liczbę\npomp potrzebnych do planu bez nakładania ich pełnych cykli.",
              "Rozpocząć **4G.2 — widok operatora**: podłączyć wynik minimalnej liczby\npomp do istniejącego licznika i czytelnie pokazać `0` dla planu bez pompowania.",
              "kolejny krok"
          )
          if "## Zamknięcie 4G.1 — minimalna techniczna liczba pomp — 2026-08-28" in etapy:
              raise SystemExit("Wpis zamknięcia 4G.1 już istnieje.")
          etapy = etapy.rstrip() + "\n\n\n" + '## Zamknięcie 4G.1 — minimalna techniczna liczba pomp — 2026-08-28\n\n- [x] niezależny moduł tworzy techniczne pompy wyłącznie na potrzeby wyznaczenia\n  minimalnej floty i nie zależy od liczby rzeczywistych pomp wpisanych przez operatora;\n- [x] do obliczenia trafiają tylko budowy z rzeczywistym pełnym okresem zajętości\n  pompy; budowy niewymagające pompy, z zerową ilością albo bez okresu są pomijane;\n- [x] pełne okresy są porządkowane według początku zajętości, a przy remisie\n  zachowują kolejność wejściową;\n- [x] pierwsza wolna pompa techniczna jest ponownie używana, gdy jej poprzedni\n  pełny cykl kończy się przed albo dokładnie w chwili rozpoczęcia kolejnego;\n- [x] nowy numer pompy technicznej powstaje tylko wtedy, gdy wszystkie wcześniej\n  utworzone pompy techniczne są jeszcze zajęte;\n- [x] wynik zawiera `minimalnaLiczbaPomp`, techniczne przydziały oraz listę\n  technicznych pomp, bez zmiany budów i kursów wejściowych;\n- [x] moduł jest ładowany lokalnie przez `index.html` i nie dodaje żadnej\n  zależności od internetu, map ani zewnętrznych bibliotek;\n- [x] test `testy/etap_4g_1.test.js` oraz pełna regresja wszystkich **43/43**\n  plików `testy/*.test.js` przechodzą poprawnie;\n- [x] wszystkie śledzone pliki JavaScript przechodzą kontrolę składni.\n\nOsobny test operatora nie jest wymagany, ponieważ 4G.1 tworzy wyłącznie wynik\nsilnika. Wyświetlenie licznika należy do 4G.2, a pełny test operatorski pozostaje\nczęścią 4J.3.\n\nZamknięty podetap: **4G.1**. Punkt nadrzędny **4G** pozostaje otwarty.\nNastępny nieukończony podetap: **4G.2 — widok operatora**.' + "\n"
          etapy_sciezka.write_text(etapy, encoding="utf-8")

          readme_sciezka = Path("README.md")
          readme = readme_sciezka.read_text(encoding="utf-8")
          readme = zamien_raz(
              readme,
              "    node testy/etap_4f_5.test.js\n",
              "    node testy/etap_4f_5.test.js\n    node testy/etap_4g_1.test.js\n",
              "lista testów README"
          )
          readme = zamien_raz(
              readme,
              "Następny krok to **4G.1 — wynik silnika minimalnej liczby pomp**. Pełne\npołączenie ograniczeń pomp i gruszek pozostaje świadomie zakresem Etapu 5.",
              "Podetap **4G.1 — wynik silnika minimalnej liczby pomp** jest zakończony.\nSilnik tworzy techniczne przydziały pełnych okresów i zwraca najmniejszą liczbę\npomp potrzebną bez nakładania cykli, niezależnie od rzeczywistej listy zasobów.\nNastępny krok to **4G.2 — widok operatora minimalnej liczby pomp**. Pełne\npołączenie ograniczeń pomp i gruszek pozostaje świadomie zakresem Etapu 5.",
              "stan README po 4G.1"
          )
          readme_sciezka.write_text(readme, encoding="utf-8")

          testy_sciezka = Path("testy/TESTY_ETAP_4.md")
          testy = testy_sciezka.read_text(encoding="utf-8")
          stary_status = (
              "Etap 4 jest rozpoczęty. Zakończono całe punkty **4A–4D** oraz podetap **4E.1**.\n"
              "Następny podetap to **4E.2 — budowa do budowy**.\n"
              "Standardowy wysięg\n"
              "`32 m` i zwijane pole **Większa pompa** są opublikowane na `main` i zostały\n"
              "potwierdzone przez operatora w przeglądarce. Pełna regresja obejmuje obecnie\n"
              "`33` zestawy testów."
          )
          nowy_status = (
              "Etap 4 jest rozpoczęty. Zakończono całe punkty **4A–4F** oraz podetap\n"
              "**4G.1 — wynik silnika minimalnej liczby pomp**. Następny podetap to\n"
              "**4G.2 — widok operatora**. Standardowy wysięg `32 m`, pełne okresy pracy,\n"
              "przejazdy i niezależny przydział pomp pozostają objęte regresją. Pełna\n"
              "regresja obejmuje obecnie `43` pliki `testy/*.test.js`."
          )
          testy = zamien_raz(
              testy,
              stary_status,
              nowy_status,
              "status TESTY_ETAP_4"
          )
          testy_sciezka.write_text(testy, encoding="utf-8")
          PY

      - name: Zapisz i wypchnij 4G.1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pompy/minimalna_liczba_pomp.js testy/etap_4g_1.test.js index.html ETAPY_ROZWOJU.md README.md testy/TESTY_ETAP_4.md
          git diff --cached --check
          git commit -m "4G.1: policz minimalna liczbe pomp"
          git push origin HEAD:main
