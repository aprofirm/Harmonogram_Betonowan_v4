name: Diagnostyka integracji 3C.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-3c3.yml"

permissions:
  contents: write

jobs:
  diagnostyka:
    if: github.event.head_commit.message == 'Uruchom diagnostykę 3C.3'
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Uruchom zmianę i testy z zapisem wyniku
        shell: bash
        run: |
          set +e
          : > /tmp/wynik_3c3.txt
          echo "=== PYTHON ===" >> /tmp/wynik_3c3.txt
          python .github/wprowadz_3c3.py >> /tmp/wynik_3c3.txt 2>&1
          STATUS=$?
          echo "PYTHON_STATUS=$STATUS" >> /tmp/wynik_3c3.txt

          if [ "$STATUS" -eq 0 ]; then
            echo "=== TESTY ===" >> /tmp/wynik_3c3.txt
            for plik in testy/*.test.js; do
              echo "=== $plik ===" >> /tmp/wynik_3c3.txt
              node "$plik" >> /tmp/wynik_3c3.txt 2>&1
              KOD=$?
              echo "STATUS=$KOD" >> /tmp/wynik_3c3.txt
              if [ "$KOD" -ne 0 ]; then
                STATUS=$KOD
              fi
            done
          fi

          echo "WYNIK_KONCOWY=$STATUS" >> /tmp/wynik_3c3.txt
          cp /tmp/wynik_3c3.txt .github/wynik_3c3.txt

      - name: Zapisz raport diagnostyczny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/wynik_3c3.txt
          git commit -m "Zapisz wynik diagnostyki 3C.3"
          git push
