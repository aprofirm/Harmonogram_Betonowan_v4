name: Jednorazowa poprawka 4F.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jednorazowa_poprawka_4f1.yml"

permissions:
  contents: write

jobs:
  poprawka:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Popraw test pustej kolejki
        shell: python
        run: |
          from pathlib import Path

          sciezka = Path(".github/workflows/jednorazowe_4f1.yml")
          tresc = sciezka.read_text(encoding="utf-8")
          zamiany = {
              'assert.deepEqual(pompy.uporzadkujBudowyDoPrzydzialuPomp([], []), []);':
                  'assert.equal(pompy.uporzadkujBudowyDoPrzydzialuPomp([], []).length, 0);',
              'assert.deepEqual(pompy.uporzadkujBudowyDoPrzydzialuPomp(null, null), []);':
                  'assert.equal(pompy.uporzadkujBudowyDoPrzydzialuPomp(null, null).length, 0);',
          }
          for stary, nowy in zamiany.items():
              if stary not in tresc:
                  raise SystemExit("Nie znaleziono oczekiwanej linii testu pustej kolejki.")
              tresc = tresc.replace(stary, nowy, 1)
          sciezka.write_text(tresc, encoding="utf-8")

      - name: Zapisz poprawkę i usuń workflow techniczny
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/jednorazowe_4f1.yml
          git rm .github/workflows/jednorazowa_poprawka_4f1.yml
          git commit -m "Popraw test pustej kolejki 4F.1"
          git push origin HEAD:main
