name: Prepare 4H4

on:
  push:
    branches:
      - 4h-4-pamiec-i-ponowne-przeliczenie
    paths:
      - .github/workflows/prepare_4h4.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 4h-4-pamiec-i-ponowne-przeliczenie

      - name: Patch project state
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Nie znaleziono oczekiwanego fragmentu w {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "ETAPY_ROZWOJU.md",
              "  - [ ] **4H.4 — pamięć i ponowne przeliczenie:** tryb oraz liczba są\n    odtwarzane, a każda zmiana buduje wynik od początku bez starych zajętości.",
              "  - [x] **4H.4 — pamięć i ponowne przeliczenie:** tryb oraz liczba są\n    odtwarzane, a każda zmiana buduje wynik od początku bez starych zajętości.\n    Test potwierdza także brak dziedziczenia przydziałów po zmianie limitu lub aktywnej listy pomp."
          )
          replace(
              "ETAPY_ROZWOJU.md",
              "Rozpocząć **4H.4 — pamięć i ponowne przeliczenie**: potwierdzić, że tryb\noraz liczba pomp są odtwarzane, a każda zmiana buduje wynik pomp od początku\nbez pozostawiania starych przydziałów i okresów zajętości.",
              "Rozpocząć **4H.5 — testy końcowe trybu „mam X pomp”**: zebrać w jednym\nzestawie flotę wystarczającą, zbyt małą, `0`, błędne dane, stabilność wyniku\ni brak nakładania pracy jednej pompy."
          )
          replace(
              "ETAPY_ROZWOJU.md",
              "# Kolejny krok",
              "## Zamknięcie 4H.4 — pamięć i ponowne przeliczenie — 2026-08-29\n\n- [x] tryb oraz liczba pomp są zachowywane w bieżącym planie i historii;\n- [x] po odświeżeniu wracają tryb, liczba oraz stan aktywności pola liczby pomp;\n- [x] wartość `0` jest odtwarzana jako prawidłowy limit;\n- [x] przejście do `Oblicz, ile potrzeba` usuwa limit z zapisywanych parametrów;\n- [x] kolejne obliczenia dla różnych limitów i aktywnych list nie dziedziczą poprzednich zajętości;\n- [x] `testy/etap_4h_4.test.js` oraz pełna regresja przechodzą.\n\nZamknięty podetap: **4H.4**. Punkt nadrzędny **4H** pozostaje otwarty.\nNastępny niezakończony podetap: **4H.5 — testy**.\n\n# Kolejny krok"
          )

          replace(
              "README.md",
              "    node testy/etap_4h_3.test.js\n",
              "    node testy/etap_4h_3.test.js\n    node testy/etap_4h_4.test.js\n"
          )
          replace(
              "README.md",
              "Podetapy **4H.1–4H.3** są zakończone.",
              "Podetapy **4H.1–4H.4** są zakończone."
          )
          replace(
              "README.md",
              "podłączenie pozostają zakresem 4I. Następny krok to **4H.4 — pamięć i ponowne\nprzeliczenie**. Pełne połączenie ograniczeń pomp i gruszek należy do Etapu 5.",
              "podłączenie pozostają zakresem 4I. 4H.4 potwierdza zapis i odtwarzanie trybu\noraz liczby pomp, w tym `0`, a także czysty stan każdego ponownego przeliczenia\nbez odziedziczonych zajętości. Następny krok to **4H.5 — testy końcowe trybu\n„mam X pomp”**. Pełne połączenie ograniczeń pomp i gruszek należy do Etapu 5."
          )

          replace(
              "testy/TESTY_ETAP_4.md",
              "### 4H — tryb „mam X pomp”",
              "### 4H.4 — pamięć i ponowne przeliczenie\n\n- bieżący plan i historia zachowują `trybPomp` oraz `liczbaDostepnychPomp`;\n- po odtworzeniu tryb ograniczony ponownie aktywuje i wymaga pola liczby pomp;\n- limit `0` jest zachowywany i odtwarzany bez zamiany na wartość pustą;\n- przejście do `Oblicz, ile potrzeba` zapisuje brak limitu jako `null`;\n- sekwencja przeliczeń `1 → 3 → 1` pomp daje ponownie identyczny wynik dla jednej pompy;\n- zmiana aktywnej listy pomp nie dziedziczy przydziału ani zajętości poprzedniej listy;\n- `testy/etap_4h_4.test.js` chroni te zachowania.\n\n### 4H — tryb „mam X pomp”"
          )

          replace("index.html", "Etap 4H.3", "Etap 4H.4")
          replace(
              "index.html",
              "4H.3 · jawne konsekwencje ograniczenia pomp",
              "4H.4 · pamięć i ponowne przeliczenie pomp"
          )
          replace(
              "js/konfiguracja/konfiguracja.js",
              'punktEtapu: "4H.3"',
              'punktEtapu: "4H.4"'
          )

      - name: Remove helper workflow
        run: rm .github/workflows/prepare_4h4.yml

      - name: Commit branch state
        run: |
          git config user.name "PawelP"
          git config user.email "53014565+aprofirm@users.noreply.github.com"
          git add ETAPY_ROZWOJU.md README.md testy/TESTY_ETAP_4.md index.html js/konfiguracja/konfiguracja.js .github/workflows/prepare_4h4.yml
          git commit -m "4H.4: zamknij pamiec i ponowne przeliczenie pomp"
          git push origin HEAD:4h-4-pamiec-i-ponowne-przeliczenie
