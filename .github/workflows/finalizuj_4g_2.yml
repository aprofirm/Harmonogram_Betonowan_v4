name: Finalizacja 4G.2

on:
  push:
    branches:
      - 4g-2-widok-minimalnej-liczby-pomp
    paths:
      - ".github/workflows/finalizuj_4g_2.yml"

permissions:
  contents: write

jobs:
  finalizacja:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz gałąź
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Podłącz moduł 4G.2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def zamien_raz(tekst, stary, nowy, opis):
              if stary not in tekst:
                  raise SystemExit("Nie znaleziono fragmentu: " + opis)
              return tekst.replace(stary, nowy, 1)

          sciezka = Path("index.html")
          tekst = sciezka.read_text(encoding="utf-8")
          stary = '    <script defer src="js/interfejs/dostepnosc_pomp.js"></script>\n'
          nowy = stary + '    <script defer src="js/interfejs/minimalna_liczba_pomp.js"></script>\n'
          tekst = zamien_raz(tekst, stary, nowy, "ładowanie widoku pomp")
          tekst = zamien_raz(
              tekst,
              "        <span>4G.2 · widok minimalnej liczby pomp</span>",
              "        <span>4G.3 · testy minimalnej liczby pomp</span>",
              "stopka 4G.2"
          )
          sciezka.write_text(tekst, encoding="utf-8")
          PY

      - name: Test 4G.2 i pełna regresja
        shell: bash
        run: |
          set -euo pipefail
          node testy/etap_4g_2.test.js
          liczba_testow=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba_testow=$((liczba_testow + 1))
          done
          echo "Liczba plików testowych: $liczba_testow"
          test "$liczba_testow" -eq 44
          while IFS= read -r plik; do
            node --check "$plik"
          done < <(git ls-files '*.js')

      - name: Zaktualizuj dokumentację
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def zamien_raz(tekst, stary, nowy, opis):
              if stary not in tekst:
                  raise SystemExit("Nie znaleziono fragmentu: " + opis)
              return tekst.replace(stary, nowy, 1)

          etapy_sciezka = Path("ETAPY_ROZWOJU.md")
          etapy = etapy_sciezka.read_text(encoding="utf-8")
          etapy = zamien_raz(
              etapy,
              "  - [ ] **4G.2 — widok operatora:** osobny licznik potrzebnych pomp i czytelna\n",
              "  - [x] **4G.2 — widok operatora:** osobny licznik potrzebnych pomp i czytelna\n",
              "checkbox 4G.2"
          )
          etapy = zamien_raz(
              etapy,
              "Rozpocząć **4G.2 — widok operatora**: podłączyć wynik minimalnej liczby\npomp do istniejącego licznika i czytelnie pokazać `0` dla planu bez pompowania.",
              "Rozpocząć **4G.3 — testy minimalnej liczby pomp**: potwierdzić wyniki `0`, `1`\ni wiele pomp oraz zgodność licznika z przydziałami technicznymi.",
              "kolejny krok po 4G.2"
          )
          zamkniecie = "\n".join([
              "## Zamknięcie 4G.2 — widok minimalnej liczby pomp — 2026-08-28",
              "",
              "- [x] istniejący licznik `minimalna-liczba-pomp` pokazuje wynik silnika 4G.1 po przeliczeniu;",
              "- [x] przed przeliczeniem i po zmianie danych licznik pozostaje nieaktualny jako `—`;",
              "- [x] plan bez budów wymagających pompy pokazuje `0` oraz komunikat `Plan nie wymaga pompy.`;",
              "- [x] tryb z określoną liczbą pomp zachowuje osobny opis rzeczywistej dostępności floty;",
              "- [x] logika prezentacji jest osobnym modułem i nie zmienia jeszcze centralnego wyniku `przeliczCalyHarmonogram()`;",
              "- [x] test `testy/etap_4g_2.test.js` i pełna regresja **44/44** przechodzą poprawnie;",
              "- [x] wszystkie śledzone pliki JavaScript przechodzą kontrolę składni.",
              "",
              "Zamknięty podetap: **4G.2**. Punkt nadrzędny **4G** pozostaje otwarty.",
              "Następny nieukończony podetap: **4G.3 — testy minimalnej liczby pomp**.",
              ""
          ])
          etapy_sciezka.write_text(etapy.rstrip() + "\n\n\n" + zamkniecie, encoding="utf-8")

          readme_sciezka = Path("README.md")
          readme = readme_sciezka.read_text(encoding="utf-8")
          readme = zamien_raz(
              readme,
              "    node testy/etap_4g_1.test.js\n",
              "    node testy/etap_4g_1.test.js\n    node testy/etap_4g_2.test.js\n",
              "lista testów README"
          )
          stary_stan = "Podetap **4G.1 — wynik silnika minimalnej liczby pomp** jest zakończony.\nSilnik tworzy techniczne przydziały pełnych okresów i zwraca najmniejszą liczbę\npomp potrzebną bez nakładania cykli, niezależnie od rzeczywistej listy zasobów.\nNastępny krok to **4G.2 — widok operatora minimalnej liczby pomp**. Pełne\npołączenie ograniczeń pomp i gruszek pozostaje świadomie zakresem Etapu 5."
          nowy_stan = "Podetapy **4G.1–4G.2** są zakończone. Silnik wyznacza najmniejszą liczbę\npomp potrzebną bez nakładania pełnych cykli, a istniejący licznik wyniku pokazuje\ntę wartość operatorowi. Plan bez pompowania pokazuje `0` i czytelny komunikat.\nNastępny krok to **4G.3 — testy minimalnej liczby pomp**. Pełne połączenie\nograniczeń pomp i gruszek pozostaje świadomie zakresem Etapu 5."
          readme = zamien_raz(readme, stary_stan, nowy_stan, "stan README po 4G.2")
          readme_sciezka.write_text(readme, encoding="utf-8")

          testy_sciezka = Path("testy/TESTY_ETAP_4.md")
          testy = testy_sciezka.read_text(encoding="utf-8")
          stary_status = "Etap 4 jest rozpoczęty. Zakończono całe punkty **4A–4F** oraz podetap\n**4G.1 — wynik silnika minimalnej liczby pomp**. Następny podetap to\n**4G.2 — widok operatora**. Standardowy wysięg `32 m`, pełne okresy pracy,\nprzejazdy i niezależny przydział pomp pozostają objęte regresją. Pełna\nregresja obejmuje obecnie `43` pliki `testy/*.test.js`."
          nowy_status = "Etap 4 jest rozpoczęty. Zakończono całe punkty **4A–4F** oraz podetapy\n**4G.1–4G.2**. Następny podetap to **4G.3 — testy minimalnej liczby pomp**.\nMinimalna liczba pomp jest już liczona i pokazywana operatorowi, w tym `0` dla\nplanu bez pompowania. Pełna regresja obejmuje obecnie `44` pliki `testy/*.test.js`."
          testy = zamien_raz(testy, stary_status, nowy_status, "status TESTY_ETAP_4")
          testy_sciezka.write_text(testy, encoding="utf-8")
          PY

      - name: Zapisz finalizację na gałęzi
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalizuj_4g_2.yml
          git add index.html ETAPY_ROZWOJU.md README.md testy/TESTY_ETAP_4.md
          git diff --cached --check
          git commit -m "4G.2: zamknij widok minimalnej liczby pomp"
          git push origin HEAD:4g-2-widok-minimalnej-liczby-pomp
