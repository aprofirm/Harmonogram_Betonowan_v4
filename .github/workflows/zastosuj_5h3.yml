name: Zastosuj 5H.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zastosuj_5h3.yml"

permissions:
  contents: write

jobs:
  zastosuj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadź 5H.3
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/zastosuj_5h3.py
          rm .github/zastosuj_5h3.py
          rm .github/workflows/zastosuj_5h3.yml

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          liczba=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba=$((liczba + 1))
          done
          echo "Pełna regresja: $liczba zestawów — wszystkie poprawne."
          test "$liczba" -eq 88

      - name: Zapisz 5H.3 na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "5H.3: dodaj czytelne komunikaty konfliktów"
          git push origin HEAD:main
