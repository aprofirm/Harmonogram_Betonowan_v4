name: Zastosuj 5J.1

on:
  push:
    branches: [work/5j1-pelna-regresja]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zastosuj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/5j1-pelna-regresja

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadź 5J.1
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/konfiguracja\.punktEtapu, "5I\.3"/.punktEtapu, "5I.3"/g; s/konfiguracja\.punktEtapu, "5J\.1"/.punktEtapu, "5J.1"/g' .github/zastosuj_5j1.py
          python3 .github/zastosuj_5j1.py
          rm .github/zastosuj_5j1.py
          rm .github/workflows/zastosuj_5j1.yml

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          liczba=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba=$((liczba + 1))
          done
          echo "Pełna regresja: $liczba zestawów — wszystkie poprawne."
          test "$liczba" -eq 92

      - name: Zapisz 5J.1 na gałęzi roboczej
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "5J.1: domknij pełną regresję Etapu 5"
          git push origin HEAD:work/5j1-pelna-regresja
