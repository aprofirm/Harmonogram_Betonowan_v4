name: Jednorazowy widok 3C.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wprowadz-3c4.yml"

permissions:
  contents: write

jobs:
  wdrozenie:
    if: github.event.head_commit.message == 'Uruchom widok 3C.4'
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wprowadź zmiany 3C.4
        run: python .github/wprowadz_3c4.py

      - name: Uruchom pełną regresję
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz zaliczone 3C.4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/konfiguracja/konfiguracja.js js/interfejs/interfejs.js testy/etap_3c_4.test.js testy/TESTY_ETAP_3C.md ETAPY_ROZWOJU.md PROJECT_DECISIONS.md README.md
          git commit -m "Pokaż numery gruszek w tabeli kursów"
          git push
