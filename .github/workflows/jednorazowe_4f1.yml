name: Jednorazowe wdrożenie 4F.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/jednorazowe_4f1.yml"

permissions:
  contents: write

jobs:
  wdrozenie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadź 4F.1
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def zapisz(sciezka, tresc):
              Path(sciezka).write_text(dedent(tresc).lstrip("\n"), encoding="utf-8")

          def zastap_raz(sciezka, stary, nowy):
              plik = Path(sciezka)
              tresc = plik.read_text(encoding="utf-8")
              if stary not in tresc:
                  raise SystemExit(f"Nie znaleziono oczekiwanego fragmentu w {sciezka}.")
              plik.write_text(tresc.replace(stary, nowy, 1), encoding="utf-8")

          zapisz("js/pompy/przydzial_pomp.js", r'''
          (function (zakresGlobalny) {
            "use strict";

            const aplikacja = zakresGlobalny.HarmonogramBetonowan;

            if (!aplikacja || !aplikacja.pompy) {
              throw new Error("Moduł przydziału pomp wymaga wcześniejszego załadowania modułu pomp.");
            }

            const pompy = aplikacja.pompy;

            function pobierzPlanowanyStartBetonowania(budowa, listaKursow) {
              if (!pompy.czyBudowaWymagaPompy(budowa)) {
                return null;
              }

              const oknoBetonowania = pompy.wyznaczPlanowaneOknoBetonowaniaBudowy(
                budowa,
                listaKursow
              );

              if (!oknoBetonowania) {
                return null;
              }

              const minutaStartu = Number(oknoBetonowania.minutaRozpoczeciaBetonowania);

              if (!Number.isFinite(minutaStartu)) {
                throw new Error(
                  "Budowa „" + String(budowa && budowa.idBudowy || "bez ID") +
                    "” nie ma poprawnego planowanego początku betonowania dla przydziału pompy."
                );
              }

              return minutaStartu;
            }

            function uporzadkujBudowyDoPrzydzialuPomp(listaBudow, listaKursow) {
              const budowy = Array.isArray(listaBudow) ? listaBudow : [];
              const kursy = Array.isArray(listaKursow) ? listaKursow : [];

              return budowy
                .map(function (budowa, indeksWejsciowy) {
                  const minutaPlanowanegoStartuBetonowania =
                    pobierzPlanowanyStartBetonowania(budowa, kursy);

                  if (minutaPlanowanegoStartuBetonowania === null) {
                    return null;
                  }

                  return {
                    budowa: budowa,
                    indeksWejsciowy: indeksWejsciowy,
                    minutaPlanowanegoStartuBetonowania:
                      minutaPlanowanegoStartuBetonowania
                  };
                })
                .filter(function (pozycja) {
                  return pozycja !== null;
                })
                .sort(function (lewa, prawa) {
                  const roznicaStartu =
                    lewa.minutaPlanowanegoStartuBetonowania -
                    prawa.minutaPlanowanegoStartuBetonowania;

                  return roznicaStartu || lewa.indeksWejsciowy - prawa.indeksWejsciowy;
                })
                .map(function (pozycja, indeksKolejnosci) {
                  return {
                    budowa: pozycja.budowa,
                    indeksWejsciowy: pozycja.indeksWejsciowy,
                    kolejnoscPrzydzialuPompy: indeksKolejnosci + 1,
                    minutaPlanowanegoStartuBetonowania:
                      pozycja.minutaPlanowanegoStartuBetonowania
                  };
                });
            }

            pompy.pobierzPlanowanyStartBetonowania = pobierzPlanowanyStartBetonowania;
            pompy.uporzadkujBudowyDoPrzydzialuPomp = uporzadkujBudowyDoPrzydzialuPomp;
          })(window);
          ''')

          zapisz("testy/etap_4f_1.test.js", r'''
          "use strict";

          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const vm = require("node:vm");

          const katalogProjektu = path.resolve(__dirname, "..");

          function wczytaj(sciezka) {
            return fs.readFileSync(path.join(katalogProjektu, sciezka), "utf8");
          }

          function wczytajModulyPomp() {
            const kontekst = { window: {} };
            kontekst.window.window = kontekst.window;
            vm.createContext(kontekst);

            [
              "js/pompy/pompy.js",
              "js/pompy/dostepnosc_pomp.js",
              "js/pompy/przejazdy_pomp.js",
              "js/pompy/przydzial_pomp.js"
            ].forEach(function (sciezka) {
              new vm.Script(wczytaj(sciezka), { filename: sciezka }).runInContext(kontekst);
            });

            return kontekst.window.HarmonogramBetonowan.pompy;
          }

          function utworzBudowe(idBudowy, dane) {
            return Object.assign({
              idBudowy: idBudowy,
              rodzajRozladunku: "pompa",
              iloscBetonuLiczbaM3: 8,
              statusRealizacji: "planowana",
              wymaganyWysiegPompyMetry: 32
            }, dane || {});
          }

          function utworzKurs(idBudowy, minutaStartu, minutaKonca) {
            return {
              idKursu: "KURS-" + idBudowy,
              idBudowy: idBudowy,
              minutaRozpoczeciaRozladunku: minutaStartu,
              minutaZakonczeniaRozladunku: minutaKonca
            };
          }

          function pobierzIdZUlozenia(ulozenie) {
            return ulozenie.map(function (pozycja) {
              return pozycja.budowa.idBudowy;
            });
          }

          function sprawdzKolejnoscIRemisy(pompy) {
            const budowy = [
              utworzBudowe("ROWNA-1", { czasPrzygotowaniaPompyRoboczyMinuty: 20 }),
              utworzBudowe("POZNA"),
              utworzBudowe("LEJ", { rodzajRozladunku: "lej" }),
              utworzBudowe("ROWNA-2", { czasPrzygotowaniaPompyRoboczyMinuty: 60 }),
              utworzBudowe("WCZESNA"),
              utworzBudowe("ZERO", { iloscBetonuLiczbaM3: 0 }),
              utworzBudowe("ZREALIZOWANA", { statusRealizacji: "zrealizowana" })
            ];
            const kursy = [
              utworzKurs("ROWNA-1", 480, 495),
              utworzKurs("POZNA", 540, 555),
              utworzKurs("LEJ", 420, 435),
              utworzKurs("ROWNA-2", 480, 495),
              utworzKurs("WCZESNA", 450, 465),
              utworzKurs("ZERO", 430, 445),
              utworzKurs("ZREALIZOWANA", 440, 455)
            ];
            const budowyPrzed = JSON.stringify(budowy);
            const kursyPrzed = JSON.stringify(kursy);
            const wynik = pompy.uporzadkujBudowyDoPrzydzialuPomp(budowy, kursy);

            assert.deepEqual(
              pobierzIdZUlozenia(wynik),
              ["WCZESNA", "ROWNA-1", "ROWNA-2", "POZNA"]
            );
            assert.deepEqual(
              wynik.map(function (pozycja) {
                return pozycja.kolejnoscPrzydzialuPompy;
              }),
              [1, 2, 3, 4]
            );
            assert.deepEqual(
              wynik.map(function (pozycja) {
                return pozycja.minutaPlanowanegoStartuBetonowania;
              }),
              [450, 480, 480, 540]
            );
            assert.equal(wynik[1].budowa.idBudowy, "ROWNA-1");
            assert.equal(wynik[2].budowa.idBudowy, "ROWNA-2");
            assert.equal(JSON.stringify(budowy), budowyPrzed);
            assert.equal(JSON.stringify(kursy), kursyPrzed);
          }

          function sprawdzPowtarzalnosc(pompy) {
            const budowy = [utworzBudowe("B"), utworzBudowe("A"), utworzBudowe("C")];
            const kursy = [
              utworzKurs("A", 600, 615),
              utworzKurs("B", 600, 615),
              utworzKurs("C", 590, 605)
            ];
            const pierwszy = pompy.uporzadkujBudowyDoPrzydzialuPomp(budowy, kursy);
            const drugi = pompy.uporzadkujBudowyDoPrzydzialuPomp(budowy, kursy);

            assert.deepEqual(pobierzIdZUlozenia(pierwszy), ["C", "B", "A"]);
            assert.deepEqual(pobierzIdZUlozenia(drugi), ["C", "B", "A"]);
          }

          function sprawdzPusteDane(pompy) {
            assert.deepEqual(pompy.uporzadkujBudowyDoPrzydzialuPomp([], []), []);
            assert.deepEqual(pompy.uporzadkujBudowyDoPrzydzialuPomp(null, null), []);
          }

          function sprawdzPodlaczenieModulu() {
            const index = wczytaj("index.html");
            const pozycjaDostepnosci = index.indexOf("js/pompy/dostepnosc_pomp.js");
            const pozycjaPrzejazdow = index.indexOf("js/pompy/przejazdy_pomp.js");
            const pozycjaPrzydzialu = index.indexOf("js/pompy/przydzial_pomp.js");
            const pozycjaGruszek = index.indexOf("js/gruszki/gruszki.js");

            assert.ok(pozycjaDostepnosci >= 0);
            assert.ok(pozycjaPrzejazdow > pozycjaDostepnosci);
            assert.ok(pozycjaPrzydzialu > pozycjaPrzejazdow);
            assert.ok(pozycjaGruszek > pozycjaPrzydzialu);
          }

          function uruchomTesty() {
            const pompy = wczytajModulyPomp();

            sprawdzKolejnoscIRemisy(pompy);
            sprawdzPowtarzalnosc(pompy);
            sprawdzPusteDane(pompy);
            sprawdzPodlaczenieModulu();

            console.log(
              "✓ Etap 4F.1: budowy pompowe mają stabilną kolejność według planowanego startu i kolejności wejściowej."
            );
          }

          uruchomTesty();
          ''')

          zapisz("testy/TESTY_ETAP_4F_1.md", r'''
          # Test 4F.1 — stabilna kolejność budów dla pomp

          ## Cel

          Potwierdzić, że przed właściwym wyborem pompy silnik tworzy jedną,
          deterministyczną kolejność rzeczywistych prac pompowych.

          ## Reguły sprawdzane automatycznie

          - wcześniejszy planowany początek betonowania jest rozpatrywany wcześniej;
          - przy tej samej minucie zachowana jest kolejność wejściowa budów;
          - różny czas przygotowania pompy nie zmienia kolejności remisu;
          - budowa niewymagająca pompy, z `0 m³`, zrealizowana albo bez okna pracy
            nie trafia do kolejki przydziału;
          - wejściowa lista budów i kursów nie jest modyfikowana;
          - ponowne uruchomienie dla tych samych danych daje tę samą kolejność;
          - moduł jest ładowany po dostępności i przejazdach pomp.

          Automatyczny test:

              node testy/etap_4f_1.test.js

          4F.1 nie wybiera jeszcze konkretnej pompy i nie wymaga osobnego testu
          operatora. Pierwszy rzeczywisty wybór zasobu należy do 4F.2, a pełny test
          operatorski Etapu 4 pozostaje w 4J.3.
          ''')

          zastap_raz(
              "index.html",
              '    <script defer src="js/pompy/przejazdy_pomp.js"></script>\n    <script defer src="js/gruszki/gruszki.js"></script>',
              '    <script defer src="js/pompy/przejazdy_pomp.js"></script>\n    <script defer src="js/pompy/przydzial_pomp.js"></script>\n    <script defer src="js/gruszki/gruszki.js"></script>'
          )
          zastap_raz(
              "index.html",
              "        <span>4F.1 · stabilna kolejność pomp</span>",
              "        <span>4F.2 · pierwsza pasująca pompa</span>"
          )

          zastap_raz(
              "ETAPY_ROZWOJU.md",
              "- [ ] Etap 4 — Pompy — **rozpoczęty; całe punkty 4A–4E oraz przygotowawczy\n  4F.0 zakończone, następny podetap to 4F.1**",
              "- [ ] Etap 4 — Pompy — **rozpoczęty; całe punkty 4A–4E, przygotowawczy\n  4F.0 oraz 4F.1 zakończone, następny podetap to 4F.2**"
          )
          zastap_raz(
              "ETAPY_ROZWOJU.md",
              "  - [ ] **4F.1 — stabilna kolejność:** budowy wymagające pompy są rozpatrywane\n    deterministycznie według planowanego startu i kolejności wejściowej.",
              "  - [x] **4F.1 — stabilna kolejność:** rzeczywiste prace budów wymagających\n    pompy są rozpatrywane deterministycznie według planowanego początku\n    betonowania, a przy remisie zachowują kolejność wejściową."
          )
          zastap_raz(
              "ETAPY_ROZWOJU.md",
              "  - [x] **4B.1 — model pompy:** stabilne ID, czytelna nazwa, typ własna lub\n    zewnętrzna, aktywność w danym dniu, godzina **Dostępna od** i miejsce na\n    rzeczywiście potrzebne parametry techniczne, np. wysięg.",
              "  - [x] **4B.1 — model pompy:** stabilne ID, czytelna nazwa, aktywność w danym\n    dniu, dostępność godzinowa i parametry techniczne, przede wszystkim wysięg.\n    Starszy typ własna/zewnętrzna pozostaje wyłącznie metadaną zgodności."
          )
          zastap_raz(
              "ETAPY_ROZWOJU.md",
              "  - [x] **4B.3 — walidacja i testy modelu:** unikalne ID, poprawne typy, bezpieczne\n    wartości puste i brak przydzielania pomp nieaktywnych.",
              "  - [x] **4B.3 — walidacja i testy modelu:** unikalne ID, poprawna aktywność,\n    dostępność i wysięg, bezpieczne wartości puste oraz brak przydzielania\n    pomp nieaktywnych."
          )
          zastap_raz(
              "ETAPY_ROZWOJU.md",
              "  - [x] **4C.1 — panel pomp:** czytelna lista z typem, aktywnością, godziną\n    **Dostępna od** i podstawowymi parametrami, działająca również na węższym\n    ekranie.",
              "  - [x] **4C.1 — panel pomp:** czytelna lista z aktywnością, godzinami\n    **Dostępna od/do** i wysięgiem, bez rozdzielania pomp własnych i\n    zewnętrznych, działająca również na węższym ekranie."
          )

          decyzje = Path("PROJECT_DECISIONS.md")
          tresc_decyzji = decyzje.read_text(encoding="utf-8")
          marker = "# Powiązane tematy otwarte"
          if "## 92. Stabilna kolejność budów przed wyborem pompy" not in tresc_decyzji:
              wpis = dedent(r'''
              ## 92. Stabilna kolejność budów przed wyborem pompy

              Przed wyborem konkretnego zasobu silnik tworzy deterministyczną kolejność
              rzeczywistych prac wymagających pompy. Do kolejki trafiają tylko budowy,
              dla których zgodnie z zasadami 4D istnieje planowane okno betonowania;
              pozycje niewymagające pompy, z `0 m³`, zrealizowane albo bez rzeczywistego
              okna pracy nie są kandydatami do przydziału.

              Podstawowym kluczem kolejności jest minuta planowanego rozpoczęcia
              betonowania, czyli początek pierwszego rozładunku w planowanym oknie.
              Nie sortujemy według początku rozstawiania pompy, nazwy budowy, ID,
              pochodzenia pompy ani długości wysięgu. Jeżeli dwie budowy mają tę samą
              minutę planowanego rozpoczęcia betonowania, zachowują kolejność wejściową.

              Ustalenie kolejności nie zmienia budów ani kursów i nie przydziela jeszcze
              pompy. Wynik zawiera indeks wejściowy, kolejny numer rozpatrywania i minutę
              planowanego startu, aby 4F.2 mogło użyć dokładnie tej samej kolejności przy
              wyborze pierwszej pasującej pompy.

              ---

              ''').lstrip("\n")
              if marker not in tresc_decyzji:
                  raise SystemExit("Nie znaleziono miejsca na decyzję 92.")
              tresc_decyzji = tresc_decyzji.replace(marker, wpis + marker, 1)
              decyzje.write_text(tresc_decyzji, encoding="utf-8")

          zastap_raz(
              "README.md",
              "model pompy, wspólny panel zasobów, lista z dostępnością i wysięgiem oraz\npamięć planu. Lista ma osobne, niemutujące operacje dodawania, edycji, zmiany\naktywności i usuwania, waliduje ID, typy i puste pola, a do przyszłego\nprzydziału przekazuje wyłącznie aktywne pompy. Pole liczby pomp korzysta z tego\nsamego kontraktu.",
              "model pompy, wspólny panel zasobów, lista z dostępnością i wysięgiem oraz\npamięć planu. Lista ma osobne, niemutujące operacje dodawania, edycji, zmiany\naktywności i usuwania, waliduje ID, aktywność, dostępność oraz wysięg, a do\nprzydziału przekazuje wyłącznie aktywne pompy. Starszy typ własna/zewnętrzna\npozostaje neutralną metadaną zgodności i nie jest pokazywany operatorowi."
          )
          zastap_raz(
              "README.md",
              "Cały punkt **4E — przejazdy pomp** jest zakończony. Przed właściwym przydziałem\ndodano przygotowawczy **4F.0 — okno dostępności pomp**: puste `Od/Do` oznacza\nbrak ograniczeń, rozpoczęta na czas budowa jest dokańczana, a pochodzenie\nwłasna/zewnętrzna nie wpływa na algorytm. Następny krok to **4F.1 — stabilna\nkolejność budów wymagających pompy**, a później 4F.2 wybierze pierwszą\npasującą pompę.",
              "Cały punkt **4E — przejazdy pomp** jest zakończony. Przygotowawczy **4F.0 —\nokno dostępności pomp** oraz **4F.1 — stabilna kolejność** są zakończone. Puste\n`Od/Do` oznacza brak ograniczeń, rozpoczęta na czas budowa jest dokańczana, a\npochodzenie własna/zewnętrzna nie wpływa na algorytm. Rzeczywiste prace pompowe\nsą porządkowane według planowanego początku betonowania, a przy remisie zachowują\nkolejność wejściową. Następny krok to **4F.2 — pierwsza pasująca pompa**."
          )
          zastap_raz(
              "README.md",
              "- [testy/TESTY_ETAP_4.md](testy/TESTY_ETAP_4.md) — plan testów pomp,",
              "- [testy/TESTY_ETAP_4.md](testy/TESTY_ETAP_4.md) — plan testów pomp,\n- [testy/TESTY_ETAP_4F_1.md](testy/TESTY_ETAP_4F_1.md) — stabilna kolejność przed przydziałem pomp,"
          )
          zastap_raz(
              "README.md",
              "    node testy/etap_4f_0.test.js\n    node testy/pamiec_planu.test.js",
              "    node testy/etap_4f_0.test.js\n    node testy/etap_4f_1.test.js\n    node testy/pamiec_planu.test.js"
          )

      - name: Sprawdź 4F.1 i pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          node --check js/pompy/przydzial_pomp.js
          node testy/etap_4f_1.test.js
          liczba=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba=$((liczba + 1))
          done
          echo "Przeszło plików testowych: $liczba"
          test "$liczba" -eq 38
          git diff --check

      - name: Zapisz 4F.1 i usuń workflow techniczny
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html \
            README.md \
            PROJECT_DECISIONS.md \
            ETAPY_ROZWOJU.md \
            js/pompy/przydzial_pomp.js \
            testy/etap_4f_1.test.js \
            testy/TESTY_ETAP_4F_1.md
          git rm .github/workflows/jednorazowe_4f1.yml
          git commit -m "Zrealizuj 4F.1 stabilną kolejność pomp"
          git push origin HEAD:main
