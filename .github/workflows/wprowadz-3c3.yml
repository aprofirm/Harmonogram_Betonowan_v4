name: Jednorazowa integracja 3C.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wprowadz-3c3.yml"

permissions:
  contents: write

jobs:
  integracja:
    if: github.event.head_commit.message == 'Uruchom integrację 3C.3'
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wprowadź 3C.3
        run: python .github/wprowadz_3c3.py

      - name: Dostosuj starsze testy do nowej zależności
        run: python .github/napraw_testy_3c3.py

      - name: Uruchom pełną regresję
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz zaliczone 3C.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/konfiguracja/konfiguracja.js js/harmonogram/harmonogram.js index.html \
            testy/etap_1.test.js testy/etap_2.test.js testy/etap_3a.test.js \
            testy/etap_3b_1.test.js testy/pamiec_aplikacji.test.js \
            testy/rodzaj_rozladunku.test.js testy/etap_3c_3.test.js \
            testy/TESTY_ETAP_3C.md ETAPY_ROZWOJU.md README.md
          git commit -m "Zintegruj przydział gruszek z harmonogramem"
          git push
