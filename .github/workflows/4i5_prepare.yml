name: Przygotowanie 4I.5

on:
  push:
    branches:
      - work/4i-5-offline-dostepnosc

permissions:
  contents: write

jobs:
  przygotowanie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: work/4i-5-offline-dostepnosc

      - name: Wprowadź 4I.5
        run: python tools/prepare_4i5.py

      - name: Sprawdź 4I.5 i pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          node testy/etap_4i_5.test.js
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Usuń pliki pomocnicze i zapisz gotowy pakiet
        shell: bash
        run: |
          rm .github/workflows/4i5_prepare.yml
          rm tools/prepare_4i5.py
          git config user.name "PawelP"
          git config user.email "53014565+aprofirm@users.noreply.github.com"
          git add -A
          git commit -m "4I.5: offline i dostępność interfejsu"
          git push origin HEAD:work/4i-5-offline-dostepnosc
