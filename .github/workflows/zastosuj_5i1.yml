name: Zastosuj 5I.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zastosuj_5i1.yml"

permissions:
  contents: write

jobs:
  zastosuj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadź 5I.1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          plik = Path(".github/zastosuj_5i1.py")
          tekst = plik.read_text(encoding="utf-8")
          poczatek = tekst.index("# 4. Zachowujemy historyczny test KP-4")
          koniec = tekst.index("# 5. Test 5I.1")
          poprawka = '''# 4. Zachowujemy historyczny test KP-4, ale aktualizujemy wyłącznie nagłówek tabeli.
          plik_kp4 = Path("testy/kp_4.test.js")
          linie_kp4 = plik_kp4.read_text(encoding="utf-8").splitlines(keepends=True)
          liczba_zmian = 0
          nowe_linie = []
          for linia in linie_kp4:
              if "assert.match(html" in linia and "Start do przeliczenia" in linia:
                  linia = linia.replace("Start do przeliczenia", "Start budowy")
                  liczba_zmian += 1
              nowe_linie.append(linia)
          if liczba_zmian != 1:
              raise SystemExit(
                  "Oczekiwano dokładnie jednego testu nagłówka Start do przeliczenia w KP-4"
              )
          plik_kp4.write_text("".join(nowe_linie), encoding="utf-8")


          '''
          plik.write_text(
              tekst[:poczatek] + poprawka + tekst[koniec:],
              encoding="utf-8"
          )
          PY
          python3 .github/zastosuj_5i1.py
          python3 - <<'PY'
          from pathlib import Path

          interfejs = Path("js/interfejs/interfejs.js")
          tekst = interfejs.read_text(encoding="utf-8")
          tekst = tekst.replace(
              '    const podsumowanieStartow = document.createElement("span");\n',
              ''
          )
          tekst = tekst.replace(
              '    podsumowanieStartow.className = "podsumowanie-startow-budowy";\n',
              ''
          )
          stare = '''    kontrolki.appendChild(etykietaZadanego);
              kontrolki.appendChild(pole);
              kontrolki.appendChild(przyciskPrzywroc);
              podsumowanieStartow.appendChild(opisPlanu);
              podsumowanieStartow.appendChild(opisStartuRoboczego);
              komorka.appendChild(kontrolki);
              komorka.appendChild(podsumowanieStartow);
          '''
          nowe = '''    kontrolki.appendChild(pole);
              kontrolki.appendChild(przyciskPrzywroc);
              kontrolki.appendChild(etykietaZadanego);
              komorka.appendChild(kontrolki);
              komorka.appendChild(opisPlanu);
              komorka.appendChild(opisStartuRoboczego);
          '''
          if stare not in tekst:
              raise SystemExit("Nie znaleziono bloku składania komórki startu 5I.1")
          tekst = tekst.replace(stare, nowe)
          interfejs.write_text(tekst, encoding="utf-8")

          css = Path("style/glowny.css")
          tekst = css.read_text(encoding="utf-8")
          tekst = tekst.replace(
              '''  white-space: nowrap;
          }

          .pole-startu-budowy {
            width: 88px;
          ''',
              '''  white-space: nowrap;
            grid-column: 1;
            grid-row: 1;
          }

          .pole-startu-budowy {
            grid-column: 2;
            grid-row: 1;
            width: 88px;
          ''',
              1
          )
          tekst = tekst.replace(
              '''.przycisk-przywroc-start {
            width: 32px;
          ''',
              '''.przycisk-przywroc-start {
            grid-column: 3;
            grid-row: 1;
            width: 32px;
          ''',
              1
          )
          tekst = tekst.replace(
              '''.podsumowanie-startow-budowy {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-top: 3px;
            white-space: nowrap;
          }
          ''',
              '''.plan-zrodlowy-startu {
            display: inline-block;
            margin-top: 3px;
          }
          ''',
              1
          )
          tekst = tekst.replace(
              '''.start-roboczy-budowy {
            color: var(--kolor-granatowy);
            font-weight: 800;
          }
          ''',
              '''.start-roboczy-budowy {
            display: inline-block;
            margin-left: 8px;
            color: var(--kolor-granatowy);
            font-weight: 800;
          }
          ''',
              1
          )
          css.write_text(tekst, encoding="utf-8")

          test = Path("testy/etap_5i_1.test.js")
          tekst = test.read_text(encoding="utf-8")
          tekst = tekst.replace(
              'assert.ok(css.includes(".podsumowanie-startow-budowy"));',
              'assert.ok(css.includes(".etykieta-startu-zadanego"));'
          )
          test.write_text(tekst, encoding="utf-8")
          PY
          rm .github/zastosuj_5i1.py
          rm .github/workflows/zastosuj_5i1.yml

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          liczba=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba=$((liczba + 1))
          done
          echo "Pełna regresja: $liczba zestawów — wszystkie poprawne."
          test "$liczba" -eq 89

      - name: Zapisz 5I.1 na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "5I.1: pokaż plan, start zadany i roboczy"
          git push origin HEAD:main
