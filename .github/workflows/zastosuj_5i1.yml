name: Zastosuj 5I.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zastosuj_5i1.yml"

permissions:
  contents: write

jobs:
  zastosuj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadź 5I.1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          plik = Path(".github/zastosuj_5i1.py")
          tekst = plik.read_text(encoding="utf-8")
          poczatek = tekst.index("# 4. Zachowujemy historyczny test KP-4")
          koniec = tekst.index("# 5. Test 5I.1")
          poprawka = '''# 4. Zachowujemy historyczny test KP-4, ale aktualizujemy nazwę kolumny.
          plik_kp4 = Path("testy/kp_4.test.js")
          tekst_kp4 = plik_kp4.read_text(encoding="utf-8")
          if "Start do przeliczenia" not in tekst_kp4:
              raise SystemExit("Nie znaleziono starej nazwy kolumny w testy/kp_4.test.js")
          plik_kp4.write_text(
              tekst_kp4.replace("Start do przeliczenia", "Start budowy"),
              encoding="utf-8"
          )


          '''
          plik.write_text(
              tekst[:poczatek] + poprawka + tekst[koniec:],
              encoding="utf-8"
          )
          PY
          python3 .github/zastosuj_5i1.py
          rm .github/zastosuj_5i1.py
          rm .github/workflows/zastosuj_5i1.yml

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          liczba=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba=$((liczba + 1))
          done
          echo "Pełna regresja: $liczba zestawów — wszystkie poprawne."
          test "$liczba" -eq 89

      - name: Zapisz 5I.1 na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "5I.1: pokaż plan, start zadany i roboczy"
          git push origin HEAD:main
