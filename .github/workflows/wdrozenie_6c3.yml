name: Kontrolowane wdrozenie 6C.3

on:
  push:
    branches:
      - work/6c3-wiele-wezlow

permissions:
  contents: write

jobs:
  wdrozenie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadz zmiany 6C.3
        run: python3 .github/patch_6c3.py

      - name: Zaktualizuj historyczne oczekiwania testow Etapu 6
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          plan = Path("testy/etap_6_plan.test.js")
          text = plan.read_text(encoding="utf-8")
          text = text.replace(
              'const stanPunktu = ["A", "B"].includes(litera) ? "x" : " ";',
              'const stanPunktu = ["A", "B", "C"].includes(litera) ? "x" : " ";'
          )
          text = text.replace(
              '''      const stan = ["A", "B"].includes(litera) ||\n        (litera === "C" && [1, 2].includes(numer))\n        ? "x"\n        : " ";''',
              '''      const stan = ["A", "B", "C"].includes(litera)\n        ? "x"\n        : " ";'''
          )
          text = text.replace(
              'assert.match(etapy, /Następny niezakończony podetap: \\*\\*6C\\.3/);',
              'assert.match(etapy, /Następny niezakończony podetap: \\*\\*6D\\.1/);'
          )
          text = text.replace(
              '/Etap 6 — Adresy, lokalizacje i trasy — \\*\\*rozpoczęty 2026-09-02; 6A–6B i 6C\\.1–6C\\.2 zakończone; następny podetap 6C\\.3\\*\\*/',
              '/Etap 6 — Adresy, lokalizacje i trasy — \\*\\*rozpoczęty 2026-09-02; 6A–6C zakończone; następny podetap 6D\\.1\\*\\*/'
          )
          text = text.replace(
              'assert.match(stan, /Rozpocząć \\*\\*6C\\.3 — gotowość na wiele węzłów\\*\\*/);',
              'assert.match(stan, /Rozpocząć \\*\\*6D\\.1 — rozszerzenie formatu pamięci\\*\\*/);'
          )
          text = text.replace(
              'assert.match(planTestow, /całe punkty \\*\\*6A–6B\\*\\* są zakończone/);',
              'assert.match(planTestow, /cały punkt \\*\\*6C\\*\\*/);'
          )
          text = text.replace(
              '"OK — Etap 6 ma kompletny plan 6A–6J, zakończone 6A–6B i 6C.1–6C.2 oraz następny krok 6C.3."',
              '"OK — Etap 6 ma kompletny plan 6A–6J, zakończone 6A–6C oraz następny krok 6D.1."'
          )
          plan.write_text(text, encoding="utf-8")

          historyczny = Path("testy/etap_6c_2.test.js")
          text = historyczny.read_text(encoding="utf-8")
          for fragment in [
              '  assert.match(etapy, /Następny niezakończony podetap: \\*\\*6C\\.3/);\n',
              '  assert.match(stan, /Ostatni zakończony podetap: \\*\\*6C\\.2/);\n',
              '  assert.match(stan, /\\*\\*103\\/103 zestawów testów\\*\\*/);\n'
          ]:
              text = text.replace(fragment, '')
          historyczny.write_text(text, encoding="utf-8")
          PY

      - name: Sprawdz skladnie
        run: |
          node --check js/lokalizacje/model_lokalizacji_i_trasy.js
          node --check js/lokalizacje/lokalizacje.js
          node --check js/pamiec/pamiec_tras.js
          node --check testy/etap_6_plan.test.js
          node --check testy/etap_6c_2.test.js
          node --check testy/etap_6c_3.test.js

      - name: Sprawdz liczbe zestawow testow
        shell: bash
        run: |
          set -euo pipefail
          LICZBA=$(find testy -maxdepth 1 -name '*.test.js' | wc -l | tr -d ' ')
          echo "Zestawy testów: $LICZBA"
          test "$LICZBA" -eq 104

      - name: Uruchom pelna regresje
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz sprawdzony pakiet 6C.3
        shell: bash
        run: |
          set -euo pipefail
          rm .github/patch_6c3.py .github/workflows/wdrozenie_6c3.yml
          git config user.name "PawelP"
          git config user.email "53014565+aprofirm@users.noreply.github.com"
          git add -A
          git commit -m "6C.3: zakresuj dane aktywnym węzłem"
          git push origin HEAD:work/6c3-wiele-wezlow
