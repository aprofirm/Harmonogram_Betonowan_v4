name: Jednorazowe wdrozenie 4F.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/etap-4f4.yml"

permissions:
  contents: write

jobs:
  wdrozenie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadz zmiany 4F.4
        run: python3 .github/scripts/etap_4f4.py

      - name: Uruchom test 4F.4
        run: node testy/etap_4f_4.test.js

      - name: Uruchom pelna regresje 41 testow
        shell: bash
        run: |
          set -euo pipefail
          liczba=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba=$((liczba + 1))
          done
          echo "Liczba zaliczonych plikow testowych: $liczba"
          test "$liczba" -eq 41

      - name: Sprawdz skladnie JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r plik; do
            node --check "$plik"
          done < <(git ls-files '*.js')

      - name: Zapisz bezpieczne zmiany na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/pompy/przydzial_pomp.js testy/etap_4f_4.test.js testy/TESTY_ETAP_4F_4.md ETAPY_ROZWOJU.md PROJECT_DECISIONS.md README.md
          git diff --cached --check
          git diff --cached --quiet && { echo "Brak zmian do zapisania."; exit 1; }
          git commit -m "4F.4: wyznacz najwczesniejszy start pompy"
          git push origin HEAD:main
