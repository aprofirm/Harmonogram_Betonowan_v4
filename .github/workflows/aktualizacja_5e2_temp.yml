name: Tymczasowa aktualizacja 5E.2

on:
  push:
    branches:
      - etap-5e2-warunek-zakonczenia

permissions:
  contents: write

jobs:
  aktualizuj:
    if: ${{ !contains(github.event.head_commit.message, '[skip-5e2-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: etap-5e2-warunek-zakonczenia
          fetch-depth: 0

      - name: Popraw techniczny skrypt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('narzedzia/aktualizuj_5e2_temp.py')
          text = path.read_text(encoding='utf-8')
          old = 'etapy = etapy_path.read_text(encoding="utf-8")netapy = replace_once('
          new = 'etapy = etapy_path.read_text(encoding="utf-8")\netapy = replace_once('
          if old not in text:
              raise SystemExit('Nie znaleziono technicznej literówki skryptu.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Wprowadz zmiany 5E.2
        run: python narzedzia/aktualizuj_5e2_temp.py

      - name: Sprawdz nowy test
        run: node testy/etap_5e_2.test.js

      - name: Uruchom pelna regresje
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz zmiany
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/harmonogram/harmonogram.js js/konfiguracja/konfiguracja.js index.html testy/TESTY_ETAP_5.md README.md ETAPY_ROZWOJU.md PROJECT_DECISIONS.md narzedzia/aktualizuj_5e2_temp.py
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          git commit -m "5E.2: dodaj jawny warunek stabilnosci [skip-5e2-patch]"
          git push origin HEAD:etap-5e2-warunek-zakonczenia
