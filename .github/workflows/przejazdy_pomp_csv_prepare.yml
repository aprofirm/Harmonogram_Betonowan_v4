name: Przygotowanie przejazdów pomp z CSV

on:
  push:
    branches: [work/4j3-testowe-przejazdy-pomp]

permissions:
  contents: write

jobs:
  przygotowanie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: work/4j3-testowe-przejazdy-pomp

      - name: Wprowadź zmianę
        shell: bash
        run: |
          set -euo pipefail
          python .github/przejazdy_pomp_csv_patch.py

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz gotową zmianę
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/przejazdy_pomp_csv_patch.py .github/workflows/przejazdy_pomp_csv_prepare.yml
          git config user.name "PawelP"
          git config user.email "53014565+aprofirm@users.noreply.github.com"
          git add -A
          git commit -m "4J.3: testowe czasy przejazdów pomp z CSV"
          git push origin HEAD:work/4j3-testowe-przejazdy-pomp
