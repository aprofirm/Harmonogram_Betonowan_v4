            const lista = pompy.normalizujListePomp([{
              idPompy: "P-42",
              nazwa: "Pompa 42 m",
              typ: "zewnetrzna",
              aktywna: true,
              dostepnaOd: "07:00",
              dostepnaDo: "15:00",
              wysiegMetry: 42
            }]);

            assert.equal(lista[0].typ, "zewnetrzna");
            assert.equal(lista[0].wysiegMetry, 42);
            assert.equal(
              pompy.pobierzPompyAktywneDoPrzydzialu(lista)[0].idPompy,
