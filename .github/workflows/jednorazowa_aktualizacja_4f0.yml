          nowy_status = '''- [ ] Etap 4 — Pompy — **rozpoczęty; całe punkty 4A–4E oraz przygotowawczy
            4F.0 zakończone, następny podetap to 4F.1**'''
          if stary_status in etapy:
              etapy = etapy.replace(stary_status, nowy_status, 1)

          marker_4f = '''- [ ] **4F — niezależny przydział pomp.**
            - [ ] **4F.1 — stabilna kolejność:**'''
          wpis_4f0 = '''- [ ] **4F — niezależny przydział pomp.**
            - [x] **4F.0 — okno dostępności pompy przed przydziałem:** model zasobu ma
              opcjonalne granice `Dostępna od/do`, a pochodzenie własna/zewnętrzna nie
              wpływa na algorytm.
              - [x] **4F.0.1 — model i zgodność:** oba pola czasu mogą być puste; nowe
                pompy nie dziedziczą początku dnia, starszy `typ` jest tylko neutralną
                metadaną, a wysięg pozostaje podstawowym parametrem technicznym.
              - [x] **4F.0.2 — panel i pamięć:** lista pomp pokazuje aktywność,
                `Dostępna od`, `Dostępna do` i wysięg; nie pokazuje wyboru
                własna/zewnętrzna, a oba czasy są zachowywane w zapisie planu.
              - [x] **4F.0.3 — granica zakończenia pracy:** pełny cykl rozpoczęty przed
                albo dokładnie o `Dostępna do` może zostać dokończony po tej godzinie,
                a wynik zachowuje liczbę minut przekroczenia do informacji operatora;
                nowy cykl po tej godzinie jest niedozwolony.
              - [x] **4F.0.4 — testy:** przypadki bez granic, tylko `od`, tylko `do`,
                obie granice, dokładna minuta końcowa, przekroczenie oraz podłączenie
                panelu są objęte `testy/etap_4f_0.test.js` i pełną regresją.
            - [ ] **4F.1 — stabilna kolejność:**'''
          if "**4F.0 — okno dostępności pompy" not in etapy:
              if marker_4f not in etapy:
                  raise SystemExit("Nie znaleziono miejsca na 4F.0.")
              etapy = etapy.replace(marker_4f, wpis_4f0, 1)

          sekcja_4f0 = dedent(r'''

          ## Zamknięcie 4F.0 — okno dostępności pomp — 2026-08-27

          - [x] puste `Dostępna od` i `Dostępna do` oznaczają brak ograniczeń;
          - [x] nowe pompy nie otrzymują już automatycznie początku dnia jako
            `dostepnaOd`, natomiast jawna godzina ze starszego zapisu jest zachowywana;
          - [x] `Dostępna do` ogranicza wyłącznie rozpoczęcie nowego pełnego cyklu;
            rozpoczęta na czas budowa jest kończona, a przekroczenie zostaje zapisane
            w wyniku dostępności do późniejszego komunikatu operatora;
          - [x] typ własna/zewnętrzna nie jest kryterium przydziału; starsza wartość
            może pozostać neutralną metadaną, a w bieżącym panelu pole typu znika;
          - [x] wysięg pozostaje kluczowym parametrem zgodności pompy z budową;
          - [x] model i panel działają jako osobne lokalne moduły bez CDN i internetu;
          - [x] pełna regresja jest warunkiem utworzenia commita przez jednorazowy
            workflow; po dodaniu `etap_4f_0.test.js` zestaw obejmuje **37** plików
            `testy/*.test.js`.

          Dla tego przygotowawczego kroku zapisano jawny wyjątek od osobnego testu
          operatora: 4F.0 nie przydziela jeszcze pomp i nie zmienia godzin budów, a
          obecność oraz podłączenie nowych pól są sprawdzane automatycznie. Pełny test
          operatorski dostępności i przydziału pozostaje w 4J.3.

          Zamknięty podetap: **4F.0**. Punkt nadrzędny **4F** pozostaje otwarty.
          Następny nieukończony podetap: **4F.1 — stabilna kolejność**.
          ''')
          if "## Zamknięcie 4F.0 — okno dostępności pomp — 2026-08-27" not in etapy:
              etapy = etapy.rstrip() + sekcja_4f0 + "\n"
          etapy_path.write_text(etapy, encoding="utf-8")

          # -----------------------------------------------------------------
          # README: aktualny model pomp i faktyczny następny krok.
          # -----------------------------------------------------------------
          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")

          readme = readme.replace(
              "Wartość **Pompa** jest na razie informacją o sposobie rozładunku. Pełna logika przydziału i dostępności pomp pozostaje zakresem Etapu 4.",
              "Wartość **Pompa** kwalifikuje budowę do niezależnego silnika pomp. Pełny przydział zasobów jest rozwijany w Etapie 4.",
              1,
          )

          stara_lista_pomp = '''- typ **Własna** albo **Zewnętrzna**,
          - znacznik aktywności w bieżącym planie,
          - godzinę **Dostępna od**,
          - wysięg w metrach, domyślnie `32 m`.'''
          nowa_lista_pomp = '''- znacznik aktywności w bieżącym planie,
          - opcjonalną godzinę **Dostępna od**,
          - opcjonalną godzinę **Dostępna do**,
          - wysięg w metrach, domyślnie `32 m`.

          Puste oba pola godzin oznaczają dostępność bez ograniczeń. Pompa, która
          rozpocznie pełny cykl obsługi budowy przed albo dokładnie o **Dostępna do**,
          kończy tę budowę nawet wtedy, gdy składanie i mycie wyjdą poza tę godzinę;
          wynik zachowuje wielkość przekroczenia do późniejszego komunikatu. Nowej
          budowy rozpoczynającej się po tej granicy pompa już nie dostaje. Program nie
          rozdziela przydziału na pompy własne i zewnętrzne — najważniejsze są wysięg,
          aktywność, dostępność, zajętość i przejazd.'''
          if stara_lista_pomp not in readme:
              raise SystemExit("Nie znaleziono starej listy pól pomp w README.")
          readme = readme.replace(stara_lista_pomp, nowa_lista_pomp, 1)

          stary_nastepny_readme = '''Podetap **4E.1** przyjmuje informacyjnie, że baza pompy znajduje się w
          betoniarni. Wyjazd do pierwszej budowy wykorzystuje ten sam zapisany czas
          dojazdu co gruszka — bez osobnego pola dla pompy. Pierwszy dojazd nie jest
          liczony jako zajętość i nie wpływa na przydział ani liczbę pomp; pompa ma po
          prostu wyjechać odpowiednio wcześniej. Dopiero przejazd po budowie A do budowy B
          będzie wpływał na możliwość dołożenia kolejnego betonowania. Następny krok to
          **4E.2 — przejazd pompy pomiędzy budowami**.'''
          nowy_nastepny_readme = '''Cały punkt **4E — przejazdy pomp** jest zakończony. Przed właściwym przydziałem
          dodano przygotowawczy **4F.0 — okno dostępności pomp**: puste `Od/Do` oznacza
          brak ograniczeń, rozpoczęta na czas budowa jest dokańczana, a pochodzenie
          własna/zewnętrzna nie wpływa na algorytm. Następny krok to **4F.1 — stabilna
          kolejność budów wymagających pompy**, a później 4F.2 wybierze pierwszą
          pasującą pompę.'''
          if stary_nastepny_readme not in readme:
              raise SystemExit("Nie znaleziono starego opisu następnego kroku w README.")
          readme = readme.replace(stary_nastepny_readme, nowy_nastepny_readme, 1)

          if "node testy/etap_4f_0.test.js" not in readme:
              marker_testow = "    node testy/etap_4b_3.test.js\n"
              dodatkowe_testy = (
                  marker_testow +
                  "    node testy/panel_pomp.test.js\n"
                  "    node testy/etap_4d_1.test.js\n"
                  "    node testy/etap_4d_2.test.js\n"
                  "    node testy/etap_4d_3.test.js\n"
                  "    node testy/etap_4e_1.test.js\n"
                  "    node testy/etap_4e_2.test.js\n"
                  "    node testy/etap_4e_3.test.js\n"
                  "    node testy/etap_4e_4.test.js\n"
                  "    node testy/etap_4f_0.test.js\n"
              )
              if marker_testow not in readme:
                  raise SystemExit("Nie znaleziono listy testów w README.")
              readme = readme.replace(marker_testow, dodatkowe_testy, 1)

          readme_path.write_text(readme, encoding="utf-8")

      - name: Sprawdź pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          liczba=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba=$((liczba + 1))
          done
          echo "Przeszło plików testowych: $liczba"
          test "$liczba" -eq 37
          git diff --check

      - name: Zapisz gotowy pakiet 4F.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html \
            README.md \
            PROJECT_DECISIONS.md \
            POMYSLY_I_BACKLOG.md \
            ETAPY_ROZWOJU.md \
            js/pompy/dostepnosc_pomp.js \
            js/interfejs/dostepnosc_pomp.js \
            testy/etap_4f_0.test.js \
            testy/TESTY_ETAP_4F_0.md
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          git commit -m "Dodaj okno dostępności pomp przed 4F.1"
          git push origin HEAD:main
