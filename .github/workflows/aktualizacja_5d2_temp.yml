name: Tymczasowa aktualizacja silnika 5D.2

on:
  push:
    branches:
      - etap-5d2-wplyw-na-nastepna-budowe

permissions:
  contents: write

jobs:
  aktualizuj-silnik:
    if: ${{ !contains(github.event.head_commit.message, '[skip-5d2-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: etap-5d2-wplyw-na-nastepna-budowe
          fetch-depth: 0

      - name: Wprowadź logikę 5D.2
        run: python narzedzia/patch_5d2_temp.py

      - name: Zapisz zmianę
        shell: bash
        run: |
          if git diff --quiet -- js/harmonogram/harmonogram.js; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/harmonogram/harmonogram.js
          git commit -m "5D.2: przenieś rzeczywistą zajętość pompy na kolejną budowę [skip-5d2-patch]"
          git push origin HEAD:etap-5d2-wplyw-na-nastepna-budowe
