name: Jednorazowa aktualizacja dokumentacji 3B.2.6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aktualizuj-dokumentacje-3b2-6.yml"

permissions:
  contents: write

jobs:
  aktualizacja:
    if: github.event.head_commit.message == 'Uruchom jednorazową aktualizację 3B.2.6'
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zaktualizuj pamięć projektu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def zamien_jeden(tekst, stary, nowy, nazwa):
              if tekst.count(stary) != 1:
                  raise SystemExit(f"Nie znaleziono dokładnie jednego fragmentu do zmiany: {nazwa}")
              return tekst.replace(stary, nowy, 1)

          etapy_path = Path("ETAPY_ROZWOJU.md")
          etapy = etapy_path.read_text(encoding="utf-8")
          etapy = zamien_jeden(
              etapy,
              "- [ ] Etap 3 — Podstawowy silnik gruszek — **w toku; wdrożono 3B.2.1–3B.2.5, następny jest 3B.2.6 — testy, regresja i dokumentacja**",
              "- [ ] Etap 3 — Podstawowy silnik gruszek — **w toku; wdrożono 3B.2.1–3B.2.6, następny jest 3B.2.7 — publikacja i test operatora**",
              "status Etapu 3"
          )
          etapy = zamien_jeden(
              etapy,
              "    - [ ] **3B.2.6 — testy, regresja i dokumentacja:**",
              "    - [x] **3B.2.6 — testy, regresja i dokumentacja:**",
              "checkbox 3B.2.6"
          )
          etapy += """

## Kontrola po 3B.2.6 — testy, regresja i dokumentacja — 2026-08-17

- [x] `js/interfejs/odstep_dostaw.js` ponownie odpowiada wyłącznie za pole
  **Odstęp dostaw**, bez logiki rodzaju rozładunku i odbiorów własnych;
- [x] `js/interfejs/rodzaj_rozladunku.js` jest osobnym modułem interfejsu dla
  wyboru rodzaju rozładunku, etykiet i rozwijanej tabeli odbiorów własnych;
- [x] logika biznesowa rodzaju rozładunku pozostaje w
  `js/budowy/rodzaj_rozladunku.js`, dzięki czemu silnik i interfejs są
  rozdzielone zgodnie z zasadami projektu;
- [x] `testy/etap_3b_2.test.js` sprawdza rytm dla odstępu `0` i większego od
  zera, różne czasy rozładunku, wydłużony załadunek, przeplatanie budów,
  walidację oraz zapis pola w pamięci;
- [x] testy `rodzaj_rozladunku.test.js` i `odbior_wlasny_tabela.test.js`
  odpowiadają aktualnemu podziałowi modułów i rzeczywistemu wariantowi KDX;
- [x] dodano workflow `.github/workflows/testy.yml`, który na `main` i w pull
  requestach uruchamia wszystkie pliki `testy/*.test.js` na Node.js 20;
- [x] pełna regresja automatyczna w GitHub Actions zakończyła się statusem
  `success` 2026-08-17; przeszły wszystkie aktualne zestawy testów;
- [x] dokumentacja testów i aktualny stan projektu zostały ujednolicone.

Podetap 3B.2.6 jest zakończony. Punkt 3B.2 i punkt nadrzędny 3B pozostają
otwarte. Następny i ostatni podetap to **3B.2.7 — publikacja i test operatora**:
kontrola GitHub Pages oraz ręczne potwierdzenie rytmu, pełnego cyklu,
przeplatania kursów i odtworzenia po odświeżeniu. Punkt 3C pozostaje
zablokowany do zamknięcia całego 3B.
"""
          etapy_path.write_text(etapy, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          stary_stan = """**Etap 3 — podstawowy silnik gruszek** jest w toku. Zakończone są: **3A — generowanie kursów**, **3B.1 — podstawowe czasy kursów** oraz kroki przekrojowe **KP-1 — pamięć planu dnia**, **KP-2 — pamięć znanych tras** i **KP-3 — budowa ręczna oraz kompaktowy widok**. W punkcie **3B.2 — rytm dostaw** wdrożono **3B.2.1–3B.2.5**: regułę rytmu, model odstępu, obliczenia pojedynczej budowy, wspólną kolejność kursów oraz interfejs i pamięć odstępu.

Dodatkowo na rzeczywistym eksporcie KDX operator potwierdził obsługę **Rodzaju rozładunku**: pusta wartość oznacza odbiór własny, odbiory własne są oddzielone od dostaw planowanych i nie wymagają trasy ani kursów, a budowy ręczne mają wybór rodzaju rozładunku. GitHub Pages opublikował działającą wersję tej poprawki 2026-08-17.

Następny formalny krok pozostaje bez zmian: **3B.2.6 — testy, regresja i dokumentacja**. W tym kroku trzeba rozszerzyć test 3B.2 poza sam model odstępu, ujednolicić testy rodzaju rozładunku z aktualnym punktem integracji oraz uporządkować odpowiedzialności modułów po awaryjnych poprawkach UI. Po 3B.2.6 pozostaje **3B.2.7 — końcowa publikacja i test operatora**. Dopiero wtedy można zamknąć **3B.2** i cały **3B** oraz rozpocząć **3C — przydział gruszek**."""
          nowy_stan = """**Etap 3 — podstawowy silnik gruszek** jest w toku. Zakończone są: **3A — generowanie kursów**, **3B.1 — podstawowe czasy kursów** oraz kroki przekrojowe **KP-1 — pamięć planu dnia**, **KP-2 — pamięć znanych tras** i **KP-3 — budowa ręczna oraz kompaktowy widok**. W punkcie **3B.2 — rytm dostaw** zakończono **3B.2.1–3B.2.6**: regułę rytmu, model odstępu, obliczenia, wspólną kolejność kursów, interfejs i pamięć oraz pełne testy i regresję.

W 3B.2.6 uporządkowano moduły po poprawkach operatorskich: interfejs odstępu dostaw i interfejs rodzaju rozładunku znów mają osobne odpowiedzialności, a logika biznesowa odbiorów własnych pozostaje w module budów. Rozszerzony test 3B.2 obejmuje rzeczywiste obliczenia rytmu, a GitHub Actions automatycznie uruchamia wszystkie testy `testy/*.test.js`. Pełna regresja 2026-08-17 zakończyła się statusem `success`.

**Następny krok: 3B.2.7 — publikacja i test operatora.** Trzeba sprawdzić najnowszą wersję na GitHub Pages i ręcznie potwierdzić rytm dostaw, brak wpływu dodatkowego odstępu na fizyczny cykl gruszki, przeplatanie kursów różnych budów oraz odtworzenie po odświeżeniu. Dopiero wtedy można zamknąć **3B.2** i cały **3B** oraz rozpocząć **3C — przydział gruszek**."""
          readme = zamien_jeden(readme, stary_stan, nowy_stan, "Aktualny stan README")
          marker = "Node.js nie jest potrzebny do zwykłego uruchomienia aplikacji."
          dopisek = """Node.js nie jest potrzebny do zwykłego uruchomienia aplikacji.

Repozytorium ma również workflow **Testy automatyczne** w GitHub Actions. Po
zmianach na `main` uruchamia on pełną regresję wszystkich plików
`testy/*.test.js` na Node.js 20, dzięki czemu wynik testów jest zapisany razem z
historią repozytorium."""
          readme = zamien_jeden(readme, marker, dopisek, "informacja o GitHub Actions")
          readme_path.write_text(readme, encoding="utf-8")

          testy_path = Path("testy/TESTY_ETAP_3.md")
          testy = testy_path.read_text(encoding="utf-8")
          stary_status = """Etap 3 jest w toku. **Punkt 3A — generowanie kursów**, krok **3B.1 — podstawowe czasy kursów** oraz kroki przekrojowe **KP-1–KP-3** są zakończone i sprawdzone. W punkcie **3B.2 — rytm dostaw** wdrożono **3B.2.1–3B.2.5**: regułę rytmu, model odstępu, obliczenia pojedynczej budowy, wspólną kolejność kursów oraz interfejs i pamięć odstępu.

Dodatkowo 2026-08-17 operator potwierdził na rzeczywistym eksporcie KDX obsługę pola **Rodzaj rozładunku** oraz oddzielenie **Odbiorów własnych** od dostaw planowanych. Odbiory własne nie wymagają trasy i nie generują kursów.

**Następny krok: 3B.2.6 — testy, regresja i dokumentacja.** Przydział i dostępność konkretnych gruszek pozostają zakresem punktów 3C–3E i nie mogą rozpocząć się przed zamknięciem całego punktu 3B."""
          nowy_status = """Etap 3 jest w toku. **Punkt 3A — generowanie kursów**, krok **3B.1 — podstawowe czasy kursów** oraz kroki przekrojowe **KP-1–KP-3** są zakończone i sprawdzone. W punkcie **3B.2 — rytm dostaw** zakończono **3B.2.1–3B.2.6**. Rozszerzone testy rytmu i pełna regresja automatyczna przeszły poprawnie.

Dodatkowo 2026-08-17 operator potwierdził na rzeczywistym eksporcie KDX obsługę pola **Rodzaj rozładunku** oraz oddzielenie **Odbiorów własnych** od dostaw planowanych. Odbiory własne nie wymagają trasy i nie generują kursów.

**Następny krok: 3B.2.7 — publikacja i test operatora.** Przydział i dostępność konkretnych gruszek pozostają zakresem punktów 3C–3E i nie mogą rozpocząć się przed zamknięciem całego punktu 3B."""
          testy = zamien_jeden(testy, stary_status, nowy_status, "status planu testów")
          zakres_start = "## Zakres 3B.2.6 — obowiązkowa kontrola przed zamknięciem"
          zakres_end = "## Test 1 — liczba kursów dla pełnych ładunków"
          poczatek = testy.index(zakres_start)
          koniec = testy.index(zakres_end)
          nowy_zakres = """## Wynik 3B.2.6 — testy i regresja

- [x] test rytmu dla dodatkowego odstępu `0`;
- [x] test rytmu dla odstępu większego od zera;
- [x] różne dokładne czasy rozładunku;
- [x] wydłużony czas załadunku bez zmiany godziny dostawy;
- [x] stabilne przeplatanie kursów różnych budów według początku załadunku;
- [x] walidacja błędnych wartości odstępu i zgodność starszych danych;
- [x] zapis pola odstępu w warstwie pamięci aplikacji;
- [x] testy rodzaju rozładunku i odbiorów własnych dopasowane do aktualnej
  architektury;
- [x] interfejs odstępu i interfejs rodzaju rozładunku rozdzielone na osobne
  moduły;
- [x] pełna regresja wszystkich `testy/*.test.js` uruchomiona przez GitHub
  Actions i zakończona statusem `success` 2026-08-17.

3B.2.6 jest zakończony. Pozostaje 3B.2.7 — publikacja i ręczny test operatora.

"""
          testy = testy[:poczatek] + nowy_zakres + testy[koniec:]
          stary_auto = """- `testy/etap_3b_2.test.js` — obecnie model odstępu, wartość domyślna, walidacja
  i zgodność starszych danych; do rozszerzenia w 3B.2.6,
- `testy/rodzaj_rozladunku.test.js` — logika rodzaju rozładunku; wymaga
  ujednolicenia z aktualnym punktem integracji,
- `testy/odbior_wlasny_tabela.test.js` — rzeczywisty wariant KDX i osobna tabela
  odbiorów własnych.

3B.2.6 kończy się dopiero po uruchomieniu powyższych testów oraz pełnej regresji
wcześniejszych modułów. Zwykłe działanie aplikacji nie wymaga Node.js ani
połączenia z internetem."""
          nowy_auto = """- `testy/etap_3b_2.test.js` — model odstępu, rytm `0` i większy od zera,
  różne czasy rozładunku, wydłużony załadunek, przeplatanie budów, walidacja i
  kontrola pamięci,
- `testy/rodzaj_rozladunku.test.js` — logika rodzaju rozładunku i kontrola
  podziału odpowiedzialności modułów,
- `testy/odbior_wlasny_tabela.test.js` — rzeczywisty wariant KDX i osobna tabela
  odbiorów własnych.

Workflow `.github/workflows/testy.yml` uruchamia wszystkie testy `testy/*.test.js`
na GitHub Actions. Regresja 3B.2.6 przeszła poprawnie. Zwykłe działanie aplikacji
nie wymaga Node.js ani połączenia z internetem."""
          testy = zamien_jeden(testy, stary_auto, nowy_auto, "sekcja testów automatycznych")
          testy_path.write_text(testy, encoding="utf-8")
          PY

      - name: Zapisz aktualizację
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETAPY_ROZWOJU.md README.md testy/TESTY_ETAP_3.md
          git commit -m "Zamknij 3B.2.6 po pełnej regresji"
          git push
