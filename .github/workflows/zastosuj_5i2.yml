name: Zastosuj 5I.2

on:
  push:
    branches: [work/5i2-konflikty-interfejs]
    paths:
      - ".github/workflows/zastosuj_5i2.yml"

permissions:
  contents: write

jobs:
  zastosuj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/5i2-konflikty-interfejs

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadź 5I.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          plik = Path(".github/zastosuj_5i2.py")
          tekst = plik.read_text(encoding="utf-8")
          tekst = tekst.replace(
              '      panelKonfliktow: pobierzWymaganyElement("panel-konfliktow"),\n'
              '      liczbaKonfliktowPanel: pobierzWymaganyElement("liczba-konfliktow-panel"),\n'
              '      listaKonfliktow: pobierzWymaganyElement("lista-konfliktow"),\n',
              '      panelKonfliktow: document.getElementById("panel-konfliktow"),\n'
              '      liczbaKonfliktowPanel: document.getElementById("liczba-konfliktow-panel"),\n'
              '      listaKonfliktow: document.getElementById("lista-konfliktow"),\n'
          )
          stare = '''  function pokazListeKonfliktow(listaKonfliktow) {
              const lista = Array.isArray(listaKonfliktow) ? listaKonfliktow : [];
              const fragment = document.createDocumentFragment();
          '''
          nowe = '''  function pokazListeKonfliktow(listaKonfliktow) {
              const lista = Array.isArray(listaKonfliktow) ? listaKonfliktow : [];

              if (
                !elementy.panelKonfliktow ||
                !elementy.liczbaKonfliktowPanel ||
                !elementy.listaKonfliktow
              ) {
                return;
              }

              const fragment = document.createDocumentFragment();
          '''
          if stare not in tekst:
              raise SystemExit("Nie znaleziono funkcji pokazListeKonfliktow w pakiecie 5I.2")
          tekst = tekst.replace(stare, nowe)
          plik.write_text(tekst, encoding="utf-8")

          for test in Path("testy").glob("*.test.js"):
              tresc = test.read_text(encoding="utf-8")
              tresc = tresc.replace('html.includes("Etap 5I.1")', 'html.includes("Etap 5I.2")')
              tresc = tresc.replace(
                  'html.includes("5I.1 · trzy godziny startu")',
                  'html.includes("5I.2 · konflikty i przestoje")'
              )
              tresc = tresc.replace(
                  'html.includes("5i1-trzy-godziny-20260831a")',
                  'html.includes("5i2-konflikty-interfejs-20260831a")'
              )
              test.write_text(tresc, encoding="utf-8")
          PY
          python3 .github/zastosuj_5i2.py
          rm .github/zastosuj_5i2.py
          rm .github/workflows/zastosuj_5i2.yml

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          liczba=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba=$((liczba + 1))
          done
          echo "Pełna regresja: $liczba zestawów — wszystkie poprawne."
          test "$liczba" -eq 90

      - name: Zapisz 5I.2 na gałęzi roboczej
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "5I.2: pokaż konflikty i przestoje operatorowi"
          git push origin HEAD:work/5i2-konflikty-interfejs
