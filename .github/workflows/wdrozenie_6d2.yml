name: Kontrolowane wdrozenie 6D.2

on:
  push:
    branches:
      - work/6d2-stabilny-klucz

permissions:
  contents: write

jobs:
  wdrozenie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadz zmiany 6D.2
        run: python3 .github/patch_6d2.py

      - name: Sprawdz skladnie
        run: |
          node --check js/pamiec/pamiec_tras.js
          node --check js/lokalizacje/lokalizacje.js
          node --check testy/etap_6d_2.test.js
          node --check testy/etap_6d_1.test.js
          node --check testy/etap_6_plan.test.js

      - name: Sprawdz liczbe zestawow testow
        shell: bash
        run: |
          set -euo pipefail
          LICZBA=$(find testy -maxdepth 1 -name '*.test.js' | wc -l | tr -d ' ')
          echo "Zestawy testów: $LICZBA"
          test "$LICZBA" -eq 106

      - name: Uruchom pelna regresje
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz sprawdzony pakiet 6D.2
        shell: bash
        run: |
          set -euo pipefail
          rm .github/patch_6d2.py .github/workflows/wdrozenie_6d2.yml
          git config user.name "PawelP"
          git config user.email "53014565+aprofirm@users.noreply.github.com"
          git add -A
          git commit -m "6D.2: ustabilizuj klucz pamięci tras"
          git push origin HEAD:work/6d2-stabilny-klucz
