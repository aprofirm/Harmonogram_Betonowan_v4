name: Kontrolowane wdrozenie 6D.1

on:
  push:
    branches:
      - work/6d1-format-pamieci

permissions:
  contents: write

jobs:
  wdrozenie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadz zmiany 6D.1
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/encoding="utf-8")ns =/encoding="utf-8")\ns =/' .github/patch_6d1.py
          python3 .github/patch_6d1.py
          python3 .github/fix_6d1_tests.py

      - name: Sprawdz skladnie
        shell: bash
        run: |
          set -euo pipefail
          node --check js/pamiec/pamiec_tras.js
          node --check js/lokalizacje/lokalizacje.js
          node --check testy/etap_6d_1.test.js
          node --check testy/etap_6_plan.test.js
          node --check testy/etap_6c_3.test.js
          node --check testy/pamiec_aplikacji.test.js
          node --check testy/pamiec_tras.test.js

      - name: Sprawdz liczbe zestawow testow
        shell: bash
        run: |
          set -euo pipefail
          LICZBA=$(find testy -maxdepth 1 -name '*.test.js' | wc -l | tr -d ' ')
          echo "Zestawy testów: $LICZBA"
          test "$LICZBA" -eq 105

      - name: Uruchom pelna regresje
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz sprawdzony pakiet 6D.1
        shell: bash
        run: |
          set -euo pipefail
          rm .github/patch_6d1.py .github/fix_6d1_tests.py .github/workflows/wdrozenie_6d1.yml
          git config user.name "PawelP"
          git config user.email "53014565+aprofirm@users.noreply.github.com"
          git add -A
          git commit -m "6D.1: rozszerz format pamięci tras do v2"
          git push origin HEAD:work/6d1-format-pamieci
