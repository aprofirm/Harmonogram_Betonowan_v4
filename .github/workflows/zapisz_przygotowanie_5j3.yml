name: Zapisz przygotowanie 5J.3

on:
  push:
    branches: [work/5j3-scenariusz]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  przygotuj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/5j3-scenariusz

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Zapisz punkt wznowienia i status testu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          # TESTY_ETAP_5.md — aktualizujemy tylko status i dopisujemy przygotowanie 5J.3.
          path = root / 'testy/TESTY_ETAP_5.md'
          text = path.read_text(encoding='utf-8')
          old = 'Etap 4 jest zamknięty. Punkty **5A–5I** są zakończone. Trwa końcowe domknięcie Etapu 5 w punkcie **5J**; bieżący podetap to **5J.1 — pełna regresja automatyczna**.'
          new = 'Etap 4 jest zamknięty. Punkty **5A–5I** oraz **5J.1–5J.2** są zakończone. Trwa końcowe domknięcie Etapu 5: scenariusz **5J.3 — test operatora** jest przygotowany i czeka na rzeczywiste wykonanie w przeglądarce.'
          if old in text:
              text = text.replace(old, new)
          if '### 5J.3 — scenariusz operatora przygotowany' not in text:
              text += '''\n\n### 5J.3 — scenariusz operatora przygotowany — 2026-08-31\n\n- status: **przygotowany, jeszcze niezaliczony przez operatora**;\n- instrukcja: `testy/SCENARIUSZ_OPERATORA_5J_3.md`;\n- sztuczne dane: `przyklady/5j3_test_operatora.csv`;\n- automatyczna kontrola oczekiwanego wyniku: `testy/etap_5j_3_przygotowanie.test.js`;\n- scenariusz A obejmuje jedną gruszkę, jedną pompę, kaskadę A → B → X → C, przesunięcia B i C, limit startu i przestój;\n- scenariusz B1 sprawdza `0` gruszek, a B2 `0` pomp;\n- test przygotowawczy nie zastępuje testu operatorskiego i nie może sam zamknąć 5J.3.\n\nPo zielonej regresji przygotowania repo powinno zawierać **94 zestawy testów**. Checkbox testu operatora pozostaje niezaznaczony do chwili rzeczywistego wykonania A, B1 i B2 w przeglądarce.\n'''
          path.write_text(text, encoding='utf-8')

          # ETAPY_ROZWOJU.md — nie zamykamy podetapu, tylko zapisujemy gotowość scenariusza.
          path = root / 'ETAPY_ROZWOJU.md'
          text = path.read_text(encoding='utf-8')
          marker = '### 5J.3 — scenariusz testu operatora przygotowany — 2026-08-31'
          if marker not in text:
              text += '''\n\n### 5J.3 — scenariusz testu operatora przygotowany — 2026-08-31\n\n- [x] przygotowano sztuczny plik `przyklady/5j3_test_operatora.csv`;\n- [x] przygotowano instrukcję `testy/SCENARIUSZ_OPERATORA_5J_3.md`;\n- [x] przygotowano automatyczną kontrolę oczekiwanego wyniku;\n- [ ] operator wykonał scenariusz A w prawdziwej przeglądarce;\n- [ ] operator wykonał scenariusz B1 — brak gruszki;\n- [ ] operator wykonał scenariusz B2 — brak pompy.\n\nSamo przygotowanie danych i automatyczna kontrola **nie zamykają 5J.3**. Punkt 5J i cały Etap 5 pozostają otwarte do rzeczywistego potwierdzenia operatora.\n'''
          path.write_text(text, encoding='utf-8')

          # STAN_PROJEKTU.md — krótki, jednoznaczny punkt wejścia na następny wątek.
          (root / 'STAN_PROJEKTU.md').write_text('''# STAN PROJEKTU — punkt wznowienia\n\nAktualizacja: 2026-08-31\n\nTen plik jest krótkim punktem wejścia do wznowienia pracy po przerwie. Pełne decyzje i historia etapów pozostają w `PROJECT_DECISIONS.md` oraz `ETAPY_ROZWOJU.md`.\n\n## Aktualny stan\n\n- Repozytorium: `aprofirm/Harmonogram_Betonowan_v4`.\n- Ostatni zakończony podetap: **5J.2 — publikacja**.\n- Punkty **5A–5I** oraz **5J.1–5J.2** są zakończone.\n- **5J.3 jest przygotowany, ale nie został jeszcze wykonany przez operatora.**\n- Punkt **5J** i cały **Etap 5** pozostają otwarte wyłącznie do zaliczenia testu operatora 5J.3.\n- Repo po przygotowaniu 5J.3 powinno przechodzić **94/94 zestawy testów**.\n\n## Potwierdzenie końcowej publikacji 5J.2\n\n- końcowy commit `main`: `5a78bc2e0ce56343fae4831f4dc3c3822cb22fc9`;\n- GitHub Actions `Testy automatyczne`: run `33397802083` — `success`;\n- GitHub Pages: run `33397801203` — `success`;\n- `pages_build_version`: `5a78bc2e0ce56343fae4831f4dc3c3822cb22fc9`;\n- adres: `https://aprofirm.github.io/Harmonogram_Betonowan_v4/`.\n\n## Gotowy test operatora 5J.3\n\nInstrukcja: `testy/SCENARIUSZ_OPERATORA_5J_3.md`.\n\nDane: `przyklady/5j3_test_operatora.csv`.\n\nAutomatyczna kontrola scenariusza: `testy/etap_5j_3_przygotowanie.test.js`.\n\n### Scenariusz A — główny\n\n- jedna gruszka;\n- jedna aktywna pompa 32 m od 07:00;\n- przejazdy pompy A → B, A → C i B → C ustawione na 0 min;\n- globalny limit startu 30 min;\n- testowy limit przestoju 5 min;\n- oczekiwane `StartRoboczy`: A `08:00`, B `09:30`, C `11:25`;\n- oczekiwany konflikt limitu C: 35 min opóźnienia przy limicie 30 min;\n- oczekiwany co najmniej jeden czytelny konflikt przestoju;\n- widoczne opóźnienie co najmniej jednego kursu z powodu jednej gruszki.\n\n### Scenariusz B — brak zasobu\n\n- B1: ustawić `0` gruszek → oczekiwany jawny **Brak gruszki**;\n- B2: przywrócić `1` gruszkę i ustawić `0` pomp → oczekiwany jawny **Brak pompy**.\n\nOperator po wykonaniu podaje tylko:\n\n- `A — OK / NIE`;\n- `B1 — OK / NIE`;\n- `B2 — OK / NIE`.\n\nPrzy niezgodności najlepiej dołączyć zrzut ekranu.\n\n## Następny krok\n\nGdy operator będzie przy komputerze, wykonać dokładnie `testy/SCENARIUSZ_OPERATORA_5J_3.md`. Dopiero po wyniku A/B1/B2 można oznaczyć **5J.3**, **5J** i cały **Etap 5** jako zakończone.\n\n## Ważna zasada wznowienia\n\nNa początku kolejnego wątku najpierw przeczytać `AGENTS.md`, `ZASADY_KODU.md`, `PROJECT_DECISIONS.md`, `POMYSLY_I_BACKLOG.md`, `ETAPY_ROZWOJU.md`, `STAN_PROJEKTU.md` i `testy/SCENARIUSZ_OPERATORA_5J_3.md`, a następnie sprawdzić aktualny `main`.\n''', encoding='utf-8')
          PY
          rm .github/workflows/zapisz_przygotowanie_5j3.yml

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          liczba=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba=$((liczba + 1))
          done
          echo "Pełna regresja: $liczba zestawów — wszystkie poprawne."
          test "$liczba" -eq 94

      - name: Zapisz przygotowanie 5J.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "5J.3: zapisz gotowy scenariusz operatora"
          git push origin HEAD:work/5j3-scenariusz
