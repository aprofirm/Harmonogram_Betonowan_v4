name: Jednorazowe zamknięcie 3B

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zamknij-3b.yml"

permissions:
  contents: write

jobs:
  zamkniecie:
    if: github.event.head_commit.message == 'Uruchom zamknięcie 3B'
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zaktualizuj pamięć projektu
        run: python .github/zamknij_3b.py

      - name: Zapisz zamknięcie 3B
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETAPY_ROZWOJU.md README.md testy/TESTY_ETAP_3.md
          git commit -m "Zamknij 3B i ustaw 3C jako następny krok"
          git push
