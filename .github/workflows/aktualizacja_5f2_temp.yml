name: Tymczasowa aktualizacja 5F.2

on:
  push:
    branches:
      - etap-5f2-limit-indywidualny

permissions:
  contents: write

jobs:
  aktualizuj:
    if: ${{ !contains(github.event.head_commit.message, '[skip-5f2-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: etap-5f2-limit-indywidualny
          fetch-depth: 0

      - name: Dopasuj skrypt do aktualnego znacznika cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("narzedzia/aktualizuj_5f2_temp.py")
          text = path.read_text(encoding="utf-8")
          old = '<script defer src="js/aplikacja.js"></script>'
          current = '<script defer src="js/aplikacja.js?v=4j3-panel-przejazdow-20260829a"></script>'
          if old not in text:
              raise SystemExit("Nie znaleziono starego wzorca cache aplikacji w skrypcie 5F.2.")
          path.write_text(text.replace(old, current, 1), encoding="utf-8")
          PY

      - name: Wprowadz zmiany 5F.2
        run: python narzedzia/aktualizuj_5f2_temp.py

      - name: Uelastycznij testy historyczne
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path_4j = Path("testy/etap_4j_3_1.test.js")
          text_4j = path_4j.read_text(encoding="utf-8")
          old_4j = '  assert.match(aplikacja, /obsluzZmianePrzejazduPompy\\s*\\n\\s*\\);/);'
          new_4j = '  assert.match(aplikacja, /obsluzZmianePrzejazduPompy(?:,|\\s*\\n\\s*\\);)/);'
          if text_4j.count(old_4j) != 1:
              raise SystemExit("Nie znaleziono jednoznacznie historycznej asercji 4J.3.")
          path_4j.write_text(text_4j.replace(old_4j, new_4j, 1), encoding="utf-8")

          path_5f1 = Path("testy/etap_5f_1.test.js")
          text_5f1 = path_5f1.read_text(encoding="utf-8")
          old_5f1 = '  assert.equal(aplikacja.konfiguracja.punktEtapu, "5F.1");\n'
          if text_5f1.count(old_5f1) != 1:
              raise SystemExit("Nie znaleziono jednoznacznie przestarzalej asercji etapu 5F.1.")
          path_5f1.write_text(text_5f1.replace(old_5f1, "", 1), encoding="utf-8")
          PY

      - name: Sprawdz nowy test
        run: node testy/etap_5f_2.test.js

      - name: Uruchom pelna regresje
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz zmiany
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/budowy/budowy.js js/aplikacja.js js/interfejs/limit_opoznienia.js js/konfiguracja/konfiguracja.js index.html testy/etap_5f_2.test.js testy/etap_5f_1.test.js testy/etap_4j_3_1.test.js testy/TESTY_ETAP_5.md README.md ETAPY_ROZWOJU.md PROJECT_DECISIONS.md
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          git commit -m "5F.2: dodaj indywidualny limit opoznienia [skip-5f2-patch]"
          git push origin HEAD:etap-5f2-limit-indywidualny
