name: Tymczasowa aktualizacja 5F.2

on:
  push:
    branches:
      - etap-5f2-limit-indywidualny

permissions:
  contents: write

jobs:
  aktualizuj:
    if: ${{ !contains(github.event.head_commit.message, '[skip-5f2-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: etap-5f2-limit-indywidualny
          fetch-depth: 0

      - name: Wprowadz zmiany 5F.2
        run: python narzedzia/aktualizuj_5f2_temp.py

      - name: Sprawdz nowy test
        run: node testy/etap_5f_2.test.js

      - name: Uruchom pelna regresje
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz zmiany
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/budowy/budowy.js js/aplikacja.js js/interfejs/limit_opoznienia.js js/konfiguracja/konfiguracja.js index.html testy/etap_5f_2.test.js testy/TESTY_ETAP_5.md README.md ETAPY_ROZWOJU.md PROJECT_DECISIONS.md
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          git commit -m "5F.2: dodaj indywidualny limit opoznienia [skip-5f2-patch]"
          git push origin HEAD:etap-5f2-limit-indywidualny
