name: Przygotowanie panelu przejazdów 4J.3

on:
  push:
    branches:
      - work/4j3-jawne-przejazdy-pomp

permissions:
  contents: write

jobs:
  przygotuj:
    if: ${{ !contains(github.event.head_commit.message, '[helper-skip]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: work/4j3-jawne-przejazdy-pomp
          fetch-depth: 0

      - name: Zapisz podział 4J.3
        run: |
          set -euo pipefail
          python .github/4j3_panel_przejazdow.py plan
          git config user.name "PawelP"
          git config user.email "53014565+aprofirm@users.noreply.github.com"
          git add ETAPY_ROZWOJU.md
          git commit -m "4J.3: rozpisz jawne przejazdy operatora [helper-skip]"
          git push origin work/4j3-jawne-przejazdy-pomp

      - name: Wdróż panel
        run: |
          set -euo pipefail
          python .github/4j3_panel_przejazdow.py wdroz
          git diff --check

      - name: Uruchom pełną regresję
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz gotowy pakiet
        run: |
          set -euo pipefail
          rm .github/4j3_panel_przejazdow.py
          rm .github/workflows/4j3_panel_przejazdow.yml
          git add -A
          git commit -m "4J.3.1: jawne edytowalne przejazdy pomp"
          git push origin work/4j3-jawne-przejazdy-pomp
