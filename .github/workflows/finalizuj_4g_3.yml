name: Finalizacja 4G.3

on:
  push:
    branches: [4g-3-testy-minimalnej-liczby-pomp]

permissions:
  contents: write

jobs:
  finalizacja:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: 4g-3-testy-minimalnej-liczby-pomp
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Potwierdz pelna regresje
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zaktualizuj dokumentacje 4G.3
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOrFail(text, before, after, file) {
            if (!text.includes(before)) {
              throw new Error(`Nie znaleziono oczekiwanego fragmentu w ${file}: ${before}`);
            }
            return text.replace(before, after);
          }

          let etapy = fs.readFileSync('ETAPY_ROZWOJU.md', 'utf8');
          etapy = replaceOrFail(
            etapy,
            '- [ ] **4G — minimalna liczba pomp.**',
            '- [x] **4G — minimalna liczba pomp.**',
            'ETAPY_ROZWOJU.md'
          );
          etapy = replaceOrFail(
            etapy,
            '  - [ ] **4G.3 — testy:** wyniki `0`, `1` i wiele pomp oraz zgodność z',
            '  - [x] **4G.3 — testy:** wyniki `0`, `1` i wiele pomp oraz zgodność z',
            'ETAPY_ROZWOJU.md'
          );
          fs.writeFileSync('ETAPY_ROZWOJU.md', etapy);

          let readme = fs.readFileSync('README.md', 'utf8');
          const staryOpis = `Licznik **potrzebnych pomp** pokazuje na tym etapie \`—\`. Nie jest to błąd ani\nwynik \`0\`: rzeczywista minimalna liczba będzie obliczana dopiero po dodaniu\npełnych czasów obsługi, zajętości i przydziału pomp w kolejnych podetapach.`;
          const nowyOpis = `Licznik **potrzebnych pomp** pokazuje po przeliczeniu najmniejszą techniczną\nliczbę pomp potrzebnych do obsługi planu bez nakładania pełnych okresów pracy.\nDla planu bez budów pompowanych pokazuje \`0\` i komunikat **Plan nie wymaga\npompy.** Wyniki \`0\`, \`1\` i wielu pomp oraz zgodność z technicznymi przydziałami\nsą objęte testami 4G.1–4G.3. Ograniczenie przydziału do rzeczywistej liczby\npomp operatora pozostaje zakresem 4H.`;
          readme = replaceOrFail(readme, staryOpis, nowyOpis, 'README.md');
          readme = replaceOrFail(
            readme,
            '    node testy/etap_4g_2.test.js',
            '    node testy/etap_4g_2.test.js\n    node testy/etap_4g_3.test.js',
            'README.md'
          );
          fs.writeFileSync('README.md', readme);

          let testy = fs.readFileSync('testy/TESTY_ETAP_4.md', 'utf8');
          testy = replaceOrFail(
            testy,
            '- wynik jest zgodny z najwyższym technicznym numerem przydzielonej pompy.',
            '- wynik jest zgodny z najwyższym technicznym numerem przydzielonej pompy;\n- `testy/etap_4g_3.test.js` formalnie sprawdza przypadki `0`, `1` i wielu pomp,\n  ciągłość numeracji zasobów, zgodność liczby przydziałów oraz brak nakładania\n  okresów jednej pompy.',
            'testy/TESTY_ETAP_4.md'
          );
          fs.writeFileSync('testy/TESTY_ETAP_4.md', testy);
          NODE

          rm .github/workflows/finalizuj_4g_3.yml

      - name: Zapisz zamkniecie 4G
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETAPY_ROZWOJU.md README.md testy/TESTY_ETAP_4.md .github/workflows/finalizuj_4g_3.yml
          git commit -m "4G.3: zamknij testy minimalnej liczby pomp"
          git push origin HEAD:4g-3-testy-minimalnej-liczby-pomp
