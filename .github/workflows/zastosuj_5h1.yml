name: Zastosuj pakiet 5H.1

on:
  push:
    branches: [main]
    paths:
      - ".automation/5h1-*.patch"
      - ".github/workflows/zastosuj_5h1.yml"

permissions:
  contents: write

jobs:
  zastosuj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Zastosuj przygotowane zmiany
        shell: bash
        run: |
          set -euo pipefail
          for plik in .automation/5h1-a.patch .automation/5h1-b.patch .automation/5h1-c.patch .automation/5h1-d.patch .automation/5h1-e.patch; do
            git apply --check "$plik"
            git apply "$plik"
          done
          rm .automation/5h1-a.patch .automation/5h1-b.patch .automation/5h1-c.patch .automation/5h1-d.patch .automation/5h1-e.patch
          rmdir .automation

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          liczba=0
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
            liczba=$((liczba + 1))
          done
          echo "Pełna regresja: $liczba zestawów — wszystkie poprawne."

      - name: Zapisz 5H.1 na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "5H.1: ujednolić kontrakt konfliktów"
          git push origin HEAD:main
