name: Poprawka cache 4J.3

on:
  push:
    branches: [fix/4j3-cache-przejazdy-pomp]

permissions:
  contents: write

jobs:
  poprawka:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: fix/4j3-cache-przejazdy-pomp

      - name: Zastosuj poprawkę
        shell: bash
        run: |
          set -euo pipefail
          python .github/4j3_cache_fix.py

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz gotową zmianę
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/4j3_cache_fix.py .github/workflows/4j3_cache_fix.yml
          git config user.name "PawelP"
          git config user.email "53014565+aprofirm@users.noreply.github.com"
          git add -A
          git commit -m "4J.3: wymuś świeże skrypty przejazdów pomp"
          git push origin HEAD:fix/4j3-cache-przejazdy-pomp
