name: Jednorazowa poprawka UI 3C.6

on:
  push:
    branches:
      - work/3c6-pogrub-start-zaladunku
    paths:
      - ".github/workflows/wprowadz-3c6-ui.yml"

permissions:
  contents: write

jobs:
  poprawka-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wprowadź poprawkę czytelności
        run: python .github/wprowadz_3c6_ui.py

      - name: Uruchom pełną regresję
        run: |
          set -e
          for plik in testy/*.test.js; do
            node "$plik"
          done

      - name: Zapisz poprawkę po testach
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/interfejs/interfejs.js style/glowny.css testy/etap_3c_4.test.js
          git commit -m "Wyróżnij start załadunku w tabeli kursów"
          git push
