name: Korekta README 4G.3

on:
  push:
    branches: [4g-3-testy-minimalnej-liczby-pomp]

permissions:
  contents: write

jobs:
  korekta:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: 4g-3-testy-minimalnej-liczby-pomp
          fetch-depth: 0

      - name: Popraw aktualny stan
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const plik = 'README.md';
          let tekst = fs.readFileSync(plik, 'utf8');
          const stary = `Podetapy **4G.1–4G.2** są zakończone. Silnik wyznacza najmniejszą liczbę\npomp potrzebną bez nakładania pełnych cykli, a istniejący licznik wyniku pokazuje\ntę wartość operatorowi. Plan bez pompowania pokazuje \`0\` i czytelny komunikat.\nNastępny krok to **4G.3 — testy minimalnej liczby pomp**. Pełne połączenie\nograniczeń pomp i gruszek pozostaje świadomie zakresem Etapu 5.`;
          const nowy = `Cały punkt **4G — minimalna liczba pomp** jest zakończony. Silnik wyznacza\nnajmniejszą liczbę pomp potrzebną bez nakładania pełnych cykli, a istniejący\nlicznik wyniku pokazuje tę wartość operatorowi. Plan bez pompowania pokazuje\n\`0\` i czytelny komunikat. Test 4G.3 potwierdza wyniki \`0\`, \`1\` i wielu pomp\noraz zgodność z technicznymi przydziałami bez nakładania pracy jednego zasobu.\nNastępny krok to **4H.1 — dwa tryby pracy pomp**. Pełne połączenie ograniczeń\npomp i gruszek pozostaje świadomie zakresem Etapu 5.`;
          if (!tekst.includes(stary)) {
            throw new Error('Nie znaleziono starego opisu bieżącego punktu 4G.');
          }
          tekst = tekst.replace(stary, nowy);
          fs.writeFileSync(plik, tekst);
          NODE
          rm .github/workflows/uzupelnij_readme_4g_3.yml

      - name: Zapisz korekte
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/uzupelnij_readme_4g_3.yml
          git commit -m "4G.3: ustaw nastepny krok 4H.1"
          git push origin HEAD:4g-3-testy-minimalnej-liczby-pomp
