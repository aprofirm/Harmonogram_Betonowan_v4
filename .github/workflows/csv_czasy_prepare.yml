name: Przygotowanie CSV z czasami

on:
  push:
    branches: [work/4j3-przygotowanie-csv-trasy]

permissions:
  contents: write

jobs:
  przygotowanie:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: work/4j3-przygotowanie-csv-trasy

      - name: Wprowadź zmianę
        shell: bash
        run: |
          set -euo pipefail
          python .github/csv_czasy_patch_v2.py

      - name: Uruchom pełną regresję
        shell: bash
        run: |
          set -euo pipefail
          for plik in testy/*.test.js; do
            echo "=== $plik ==="
            node "$plik"
          done

      - name: Zapisz gotowy pakiet
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/csv_czasy_patch.py .github/csv_czasy_patch_v2.py .github/workflows/csv_czasy_prepare.yml
          git config user.name "PawelP"
          git config user.email "53014565+aprofirm@users.noreply.github.com"
          git add -A
          git commit -m "CSV: importuj czasy dojazdu i powrotu"
          git push origin HEAD:work/4j3-przygotowanie-csv-trasy
