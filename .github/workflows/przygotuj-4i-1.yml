name: Przygotuj 4I1

on:
  push:
    branches:
      - 4i-1-centralny-wynik-pomp

permissions:
  contents: write

jobs:
  przygotuj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: 4i-1-centralny-wynik-pomp
          fetch-depth: 0

      - name: Przygotuj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Zastosuj zmiany 4I.1
        continue-on-error: true
        run: python3 narzedzia/aktualizuj_4i_1.py

      - name: Dokończ aktualizację README i planu testów
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '    node testy/etap_4h_5.test.js\n    node testy/pamiec_planu.test.js'
          new = '    node testy/etap_4h_5.test.js\n    node testy/etap_4i_1.test.js\n    node testy/pamiec_planu.test.js'
          if old in text:
              text = text.replace(old, new, 1)
          old = '''nakładania pracy jednej pompy. Następny krok to **4I.1 — centralny wynik pomp**.\nPełne połączenie ograniczeń pomp i gruszek należy do Etapu 5.'''
          new = '''nakładania pracy jednej pompy. Cały punkt 4H pozostaje zakończony.\nPełne połączenie ograniczeń pomp i gruszek należy do Etapu 5.\n\n**4I.1 — centralny wynik pomp** jest zakończony. `przeliczCalyHarmonogram()`\nzwraca teraz osobny rzeczywisty wynik `pompy`. W trybie `Oblicz, ile potrzeba`\nzawiera on minimalną liczbę pomp oraz techniczny wynik minimalnej floty, a w\ntrybie `Mam określoną liczbę` korzysta z rzeczywistej listy pomp i pełnego\nkontraktu 4H. Wynik pomp jest liczony na bazowych kursach i nie zmienia\n`StartRoboczy` ani wyniku gruszek. Następny krok to **4I.2 — wspólne sterowanie\nzasobami**.'''
          if old not in text:
              raise SystemExit('Nie znaleziono końcowego opisu 4H w README.md')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')

          testy = Path('testy/TESTY_ETAP_4.md')
          test_text = testy.read_text(encoding='utf-8')
          marker = '### 4I.1 — centralny wynik pomp'
          if marker not in test_text:
              test_text += '''\n\n### 4I.1 — centralny wynik pomp\n\n- `przeliczCalyHarmonogram()` zwraca wynik pomp w polu `pompy`, a nie pusty placeholder;\n- tryb `Oblicz, ile potrzeba` zwraca minimalną flotę techniczną bez tworzenia rzeczywistych pomp;\n- tryb `Mam określoną liczbę` wykorzystuje przekazaną listę rzeczywistych pomp i kontrakt 4H;\n- `0` pomp pozostaje jawnym brakiem zasobu;\n- wynik pomp korzysta z bazowych kursów sprzed ewentualnych przesunięć gruszek;\n- `StartRoboczy` budów i kursy gruszek pozostają niezmienione przez obliczenie pomp;\n- `testy/etap_4i_1.test.js` sprawdza oba tryby, walidację i granicę Etapu 4.\n'''
              testy.write_text(test_text, encoding='utf-8')
          PY

      - name: Zachowaj zgodność uproszczonych testów wcześniejszych etapów
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/harmonogram/harmonogram.js')
          text = p.read_text(encoding='utf-8')
          old = '''    const ustawieniaTrybuPomp = pobierzUstawieniaTrybuPomp(parametry);\n\n    if (ustawieniaTrybuPomp.trybPomp === "mam-okreslona-liczbe") {'''
          new = '''    const ustawieniaTrybuPomp = pobierzUstawieniaTrybuPomp(parametry);\n    const czyPelnySilnikPompDostepny =\n      typeof aplikacja.pompy.obliczMinimalnaLiczbePomp === "function" &&\n      typeof aplikacja.pompy.obliczOgraniczonyWynikPomp === "function";\n\n    if (!czyPelnySilnikPompDostepny) {\n      return aplikacja.pompy.utworzPustyStanPomp();\n    }\n\n    if (ustawieniaTrybuPomp.trybPomp === "mam-okreslona-liczbe") {'''
          if old not in text:
              raise SystemExit('Nie znaleziono miejsca na fallback starszych testów')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Uruchom pełną regresję
        run: |
          for test in testy/*.test.js; do
            echo "=== $test ==="
            node "$test"
          done

      - name: Usuń pliki pomocnicze
        run: |
          rm narzedzia/aktualizuj_4i_1.py
          rm .github/workflows/przygotuj-4i-1.yml

      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania"
            exit 0
          fi
          git commit -m "4I.1: podlacz centralny wynik pomp"
          git push origin HEAD:4i-1-centralny-wynik-pomp
