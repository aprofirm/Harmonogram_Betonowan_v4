name: Tymczasowa aktualizacja statusu 5D.1

on:
  push:
    branches:
      - etap-5d1-rzeczywiste-okno

permissions:
  contents: write

jobs:
  aktualizuj-etapy:
    if: ${{ !contains(github.event.head_commit.message, '[skip-5d1-doc]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          ref: etap-5d1-rzeczywiste-okno
          fetch-depth: 0

      - name: Zaktualizuj ETAPY_ROZWOJU.md bez utraty historii
        shell: python
        run: |
          from pathlib import Path

          sciezka = Path("ETAPY_ROZWOJU.md")
          tekst = sciezka.read_text(encoding="utf-8")

          zamiany = [
              (
                  "- [ ] Etap 5 — Pełny silnik harmonogramu, konflikty i korekty — **rozpoczęty; następny podetap 5D.1**",
                  "- [ ] Etap 5 — Pełny silnik harmonogramu, konflikty i korekty — **rozpoczęty; następny podetap 5D.2**",
              ),
              (
                  "  - [ ] **5D.1 — rzeczywiste okno betonowania:** okres pracy pompy wynika z\n    faktycznych godzin rozładunków po przydziale gruszek, nie tylko z planu bazowego.",
                  "  - [x] **5D.1 — rzeczywiste okno betonowania:** okres pracy pompy wynika z\n    faktycznych godzin rozładunków po przydziale gruszek, nie tylko z planu bazowego.",
              ),
              (
                  "Rozpocząć **5D.1 — rzeczywiste okno betonowania**. Okres pracy pompy ma wynikać z faktycznych godzin rozładunków po przydziale gruszek, a nie wyłącznie z kursów bazowych.",
                  "Rozpocząć **5D.2 — wpływ na następną budowę**. Wydłużony przez rzeczywiste dostawy okres zajętości pompy ma przesunąć jej gotowość i w razie potrzeby skorygować kolejną budowę.",
              ),
          ]

          for stary, nowy in zamiany:
              liczba = tekst.count(stary)
              if liczba != 1:
                  raise SystemExit(f"Oczekiwano dokładnie 1 wystąpienia, znaleziono {liczba}: {stary!r}")
              tekst = tekst.replace(stary, nowy, 1)

          znacznik = (
              "Podetap **5C.3** oraz cały punkt **5C** są zakończone. Etap 5 pozostaje otwarty.\n"
              "Następny niezakończony podetap: **5D.1 — rzeczywiste okno betonowania**.\n\n\n"
              "## Weryfikacja produkcyjnego KDX — 2026-08-14"
          )
          wpis = (
              "Podetap **5C.3** oraz cały punkt **5C** są zakończone. Etap 5 pozostaje otwarty.\n"
              "Następny niezakończony podetap: **5D.1 — rzeczywiste okno betonowania**.\n\n"
              "## Zamknięcie 5D.1 — rzeczywiste okno betonowania — 2026-08-30\n\n"
              "- [x] po przydziale gruszek silnik ponownie wyznacza okno betonowania z kursów o statusie `przydzielony`;\n"
              "- [x] planowane okno pompy pozostaje punktem odniesienia, a `rzeczywisteOknoBetonowania` przechowuje faktyczne granice pierwszego i ostatniego rozładunku;\n"
              "- [x] przy jednej gruszce dla budowy 16 m³ drugi faktyczny rozładunek przesuwa się o `10 min` do `08:25–08:40`, przez co betonowanie wydłuża się z `30` do `40 min`;\n"
              "- [x] pełny rzeczywisty okres pompy 32 m wydłuża się w tym scenariuszu z `07:40–09:00` do `07:40–09:10`;\n"
              "- [x] ten sam okres jest synchronizowany w wyniku budowy, liście okresów i stanie konkretnej pompy;\n"
              "- [x] 5D.1 nie przesuwa jeszcze kolejnej budowy na podstawie wydłużonego okresu — ten zakres pozostaje w 5D.2;\n"
              "- [x] `testy/etap_5d_1.test.js` oraz pełna regresja przechodzą poprawnie.\n\n"
              "Podetap **5D.1** jest zakończony. Punkt nadrzędny **5D** i cały Etap 5 pozostają otwarte.\n"
              "Następny niezakończony podetap: **5D.2 — wpływ na następną budowę**.\n\n\n"
              "## Weryfikacja produkcyjnego KDX — 2026-08-14"
          )

          if tekst.count(znacznik) != 1:
              raise SystemExit("Nie znaleziono jednoznacznego miejsca na wpis zamknięcia 5D.1.")
          tekst = tekst.replace(znacznik, wpis, 1)
          sciezka.write_text(tekst, encoding="utf-8")

      - name: Zapisz dokładną zmianę dokumentacji
        shell: bash
        run: |
          if git diff --quiet -- ETAPY_ROZWOJU.md; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETAPY_ROZWOJU.md
          git commit -m "5D.1: zamknij podetap w planie rozwoju [skip-5d1-doc]"
          git push origin HEAD:etap-5d1-rzeczywiste-okno
