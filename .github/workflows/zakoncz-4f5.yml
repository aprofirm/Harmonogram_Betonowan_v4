name: Zamkniecie dokumentacji 4F.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zakoncz-4f5.yml"

permissions:
  contents: write

jobs:
  aktualizacja:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zaktualizuj dokumentacje
        run: python3 .github/scripts/zakoncz_4f5.py

      - name: Sprawdz zmiany
        run: git diff --check

      - name: Zapisz zmiany na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ETAPY_ROZWOJU.md README.md index.html
          git commit -m "4F.5: zamknij niezalezny przydzial pomp"
          git push origin main
